      required: [id, provider, installation_id, task_attempt_id, attempt_no, task_id, run_id, agent_role, status, exit_code,
        failure_category, timeout_seconds, output_artifact_id, created_at, started_at, finished_at, duration_ms]
    ProviderExecutionPage:
      type: object
      properties:
        items:
