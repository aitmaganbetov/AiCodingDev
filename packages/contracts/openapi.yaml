          format: uuid
        body: {type: string}
        message_kind: {$ref: '#/components/schemas/ChatMessageKind'}
        created_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
      required: [id, thread_id, sender_type, body, message_kind, created_at]
    DirectiveTarget:
      type: object
      properties:
        type: {$ref: '#/components/schemas/DirectiveTargetType'}
        role: {$ref: '#/components/schemas/AgentRole'}
        task_id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
      required: [type]
      additionalProperties: false
      description: type=role ⇒ role обязателен; task ⇒ task_id; approval ⇒ approval_id; run ⇒ без доп. полей.
    DirectiveCreateRequest:
      type: object
      properties:
        target: {$ref: '#/components/schemas/DirectiveTarget'}
