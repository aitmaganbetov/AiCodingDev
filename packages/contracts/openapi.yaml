      required: [id, task_id, attempt_no, status, agent_role]
    TaskAttemptPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TaskAttempt'}
        next_cursor:
          type: [string, 'null']
