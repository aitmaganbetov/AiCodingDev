        task_id:
          type: [string, 'null']
          format: uuid
        action_type: {$ref: '#/components/schemas/ApprovalActionType'}
        status: {$ref: '#/components/schemas/ApprovalStatus'}
        risk_level: {$ref: '#/components/schemas/RiskLevel'}
        summary: {type: string}
