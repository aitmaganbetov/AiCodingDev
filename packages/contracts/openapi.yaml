        catalog:
          oneOf:
          - type: object
            properties:
              template_version: {type: string}
              enabled: {type: boolean}
              updated_at: {type: string, format: date-time}
            required: [template_version, enabled, updated_at]
          - {type: 'null'}
          description: Строка справочника agent_profiles; null — справочник не синхронизирован
      required: [role, template_version, template_ref, template_sha256, permissions, prototype_permissions, allowed_tools,
        required_capabilities, acp_send, complexity_band, independent_check_from, must_differ_from_author, can_send_fix_request,
        eligible_providers, catalog]
    AgentProfileList:
