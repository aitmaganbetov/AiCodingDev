# AiCodingDev REST API v1 — Phase 0 contract. Источник правил: docs/api/API_DESIGN.md.
openapi: 3.1.0
info:
  title: AiCodingDev Internal REST API
  version: 1.0.0-phase0
  description: 'Phase 0 контракт (ТЗ §8). Правила — docs/api/API_DESIGN.md. Операции с x-tz-addition: true — дополнения к таблице ТЗ §8. Ничего
    не реализовано; спецификация переносится в packages/contracts/ в Phase 1 (ADR-0013).'
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
- {url: /api/v1}
security:
- cookieAuth: []
  csrfHeader: []
tags:
- {name: auth}
- {name: health}
- {name: workspaces}
- {name: projects}
- {name: runs}
- {name: chat}
- {name: tasks}
- {name: evidence}
- {name: quality}
- {name: providers}
- {name: approvals}
- {name: documentation}
- {name: audit}
paths:
  /auth/login:
    post:
      operationId: login
      summary: Вход локальной учётной записью [дополнение к ТЗ]
      tags: [auth]
      description: 'Без X-CSRF-Token: защита login-CSRF через проверку Origin/Sec-Fetch-Site. Ротация session id. Неверные данные ⇒ 401 без указания,
        что именно неверно. Лимит 10/мин на IP и блокировка аккаунта после 5 неудач (locked_until).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security: []
      x-required-permission: public
      x-audit-action: auth.login
      x-tz-addition: true
  /auth/logout:
    post:
      operationId: logout
      summary: Выход (отзыв сессии) [дополнение к ТЗ]
      tags: [auth]
      responses:
        '204':
          description: Сессия отозвана; cookies очищены
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: authenticated
      x-audit-action: auth.logout
      x-tz-addition: true
  /auth/session:
    get:
      operationId: getSession
      summary: Текущая сессия, CSRF-токен и членства [дополнение к ТЗ]
      tags: [auth]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: authenticated
      x-audit-action: none
      x-tz-addition: true
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness [дополнение к ТЗ]
      tags: [health]
      security: []
      servers:
      - {url: /, description: Health-эндпоинты вне /api/v1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: public
      x-audit-action: none
      x-tz-addition: true
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness [дополнение к ТЗ]
      tags: [health]
      security: []
      servers:
      - {url: /, description: Health-эндпоинты вне /api/v1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: Не готов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
      x-required-permission: public
      x-audit-action: none
      x-tz-addition: true
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: Workspaces текущего пользователя
      tags: [workspaces]
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspacePage'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: authenticated
      x-audit-action: none
    post:
      operationId: createWorkspace
      summary: Создать workspace (создатель становится owner)
      tags: [workspaces]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: workspace:create
      x-audit-action: workspace.create
  /workspaces/{workspace_id}/members:
    get:
      operationId: listMembers
      summary: Участники workspace [дополнение к ТЗ]
      tags: [workspaces]
      parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberPage'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: member:read
      x-audit-action: none
      x-tz-addition: true
    post:
      operationId: addMember
      summary: Добавить участника [дополнение к ТЗ]
      tags: [workspaces]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/WorkspaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: member:manage
      x-audit-action: member.add
      x-tz-addition: true
  /workspaces/{workspace_id}/members/{user_id}:
    patch:
      operationId: updateMember
      summary: Изменить роль участника [дополнение к ТЗ]
      tags: [workspaces]
      description: Понижение последнего owner ⇒ 409 last_owner.
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/UserId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberUpdateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: member:manage
      x-audit-action: member.role_change
      x-tz-addition: true
    delete:
      operationId: removeMember
      summary: Удалить участника [дополнение к ТЗ]
      tags: [workspaces]
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/UserId'}
      responses:
        '204': {description: 'Удалён; его сессии теряют доступ к workspace, SSE закрываются'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: member:manage
      x-audit-action: member.remove
      x-tz-addition: true
  /projects:
    get:
      operationId: listProjects
      summary: Проекты workspace
      tags: [projects]
      parameters:
      - {$ref: '#/components/parameters/WorkspaceHeader'}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/ProjectStatus'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: project:read
      x-audit-action: none
    post:
      operationId: createProject
      summary: Создать проект
      tags: [projects]
      parameters:
      - {$ref: '#/components/parameters/WorkspaceHeader'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: project:create
      x-audit-action: project.create
  /projects/{project_id}:
    get:
      operationId: getProject
      summary: Проект и настройки
      tags: [projects]
      parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: project:read
      x-audit-action: none
    patch:
      operationId: updateProject
      summary: Изменить метаданные/настройки
      tags: [projects]
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/ProjectId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectUpdateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: project:update
      x-audit-action: project.update
  /projects/{project_id}/repositories:
    get:
      operationId: listRepositories
      summary: Репозитории проекта [дополнение к ТЗ]
      tags: [projects]
      parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryPage'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: project:read
      x-audit-action: none
      x-tz-addition: true
    post:
      operationId: attachRepository
      summary: Привязать репозиторий
      tags: [projects]
      description: Валидирует путь/URL, регистрирует репозиторий и ставит indexing_job (асинхронно).
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ProjectId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepositoryAttachRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: repository:attach
      x-audit-action: repository.attach
  /projects/{project_id}/technologies:
    get:
      operationId: listTechnologies
      summary: Определённый стек
      tags: [projects]
      parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TechnologyPage'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: project:read
      x-audit-action: none
  /projects/{project_id}/documentation-policy:
    get:
      operationId: getDocumentationPolicy
      summary: Режим документации
      tags: [projects]
      parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentationPolicy'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: project:read
      x-audit-action: none
    patch:
      operationId: updateDocumentationPolicy
      summary: Изменить OFF/SMART/STRICT
      tags: [projects]
      description: ETag основан на project_settings.settings_version. Действует для новых runs и следующих context packs; уже выданные context
        packs не меняются.
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/ProjectId'}
      requestBody:
        required: true
        content:
