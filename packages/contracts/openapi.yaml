        approved_by:
          oneOf:
          - {$ref: '#/components/schemas/UserRef'}
          - {type: 'null'}
        approved_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [control_id, standard_code, edition, clause_ref, control_code, description, verification_method, approval_state,
        applicability, blocking, effective_blocking]
