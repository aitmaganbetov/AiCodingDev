  /runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      summary: SSE-поток событий run
      tags: [runs]
      description: 'Повторная отправка событий из run_event_log с seq > Last-Event-ID, затем live. Проверка доступа при подключении и каждые 60
        с / при событии смены членства. Лимиты: 5 соединений на пользователя, max lifetime 30 мин.'
      parameters:
      - {$ref: '#/components/parameters/RunId'}
      - name: Last-Event-ID
        in: header
        schema: {type: string, pattern: '^[0-9]+$'}
        description: seq последнего полученного события
      - name: after_seq
        in: query
        schema: {type: integer, minimum: 0}
        description: Альтернатива Last-Event-ID для первичного подключения; заголовок имеет приоритет
      - name: types
        in: query
        schema:
          type: array
          items: {$ref: '#/components/schemas/SseEventType'}
        description: Фильтр типов (heartbeat всегда)
      - name: task_id
        in: query
        schema: {type: string, format: uuid}
        description: Фильтр по задаче
      responses:
        '200':
          description: 'text/event-stream. Кадры: `id: <seq>`, `event: <type>`, `data: <SseEnvelope JSON>`; heartbeat каждые 15 с; `retry: 3000`.'
          content:
            text/event-stream:
              schema: {type: string}
              x-sse-event-schema: {$ref: '#/components/schemas/SseEvent'}
              example: 'id: 42

                event: task.state_changed

                data: {"event_id":"...","run_id":"...","seq":42,"type":"task.state_changed","timestamp":"2026-11-08T09:00:00Z","schema_version":"1.0","payload":{}}


                '
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            X-Accel-Buffering:
              schema: {type: string, const: 'no'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410':
          description: 410 replay_window_exceeded — запрошенный seq вне хранения; перечитать состояние REST и переподключиться с after_seq=последний
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: run:read
      x-audit-action: sse.connect
