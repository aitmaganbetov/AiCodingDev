          x-proposed-enum: true
          description: Предлагаемое дополнение к каноническим перечислениям (API_DESIGN.md, §19 «Предлагаемые дополнения»); требует утверждения.
        requested_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        completed_at:
          type: [string, 'null']
          format: date-time
        installation:
          oneOf:
          - {$ref: '#/components/schemas/ProviderInstallation'}
          - {type: 'null'}
          description: Проверенная установка (COMPLETED/FAILED); без учётных данных и путей
        error_category:
          oneOf:
          - {$ref: '#/components/schemas/CliErrorCode'}
          - {type: 'null'}
      required: [probe_request_id, provider_id, status, requested_at, completed_at, installation, error_category]
    Approval:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        run_id:
          type: [string, 'null']
          format: uuid
          description: 'null — действие вне run (например, DOCS_DOWNLOAD)'
        task_id:
          type: [string, 'null']
          format: uuid
        action_type: {$ref: '#/components/schemas/ApprovalActionType'}
        status: {$ref: '#/components/schemas/ApprovalStatus'}
        risk_level: {$ref: '#/components/schemas/RiskLevel'}
        summary: {type: string}
        context: {type: object, additionalProperties: true, description: 'Детали действия (diff ref, migration plan, target branch...) без секретов'}
        requested_by:
          type: object
          properties:
            actor_type:
              type: string
              enum: [user, agent, system]
            user:
              oneOf:
              - {$ref: '#/components/schemas/UserRef'}
              - {type: 'null'}
            role:
              oneOf:
              - {$ref: '#/components/schemas/AgentRole'}
              - {type: 'null'}
          required: [actor_type]
        decided_by:
          oneOf:
          - {$ref: '#/components/schemas/UserRef'}
          - {type: 'null'}
        decision_reason:
          type: [string, 'null']
        can_decide: {type: boolean, description: Может ли текущий пользователь принять решение (RBAC + four-eyes)}
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        decided_at:
          type: [string, 'null']
          format: date-time
        version: {type: integer, format: int64, minimum: 0, description: Optimistic locking version; ETag = "v<version>"}
      required: [id, workspace_id, run_id, action_type, status, risk_level, summary, requested_by, can_decide, created_at, version]
    ApprovalPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Approval'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница Approval (cursor pagination).
    ApprovalDecisionRequest:
      type: object
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        reason: {type: string, maxLength: 4000}
      required: [decision]
      additionalProperties: false
      description: reason обязателен для REJECTED и для critical-действий (валидация 422).
    DocumentationSource:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        technology_version_id: {type: string, format: uuid}
        source_type: {$ref: '#/components/schemas/DocumentationSourceType'}
        uri_or_file_ref: {type: string}
        trust_level: {$ref: '#/components/schemas/DocumentationTrustLevel'}
        license_info:
          type: [string, 'null']
        refresh_policy: {$ref: '#/components/schemas/DocumentationRefreshPolicy'}
        enabled: {type: boolean}
        latest_snapshot:
          oneOf:
          - type: object
            properties:
              id: {type: string, format: uuid}
              content_hash: {type: string}
              fetched_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
              status: {type: string}
            required: [id, fetched_at, status]
          - {type: 'null'}
        created_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
      required: [id, workspace_id, technology_version_id, source_type, uri_or_file_ref, trust_level, refresh_policy, enabled, created_at]
    DocumentationSourcePage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DocumentationSource'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница DocumentationSource (cursor pagination).
    DocumentationSourceCreateRequest:
      type: object
      properties:
        technology_version_id: {type: string, format: uuid}
        source_type: {$ref: '#/components/schemas/DocumentationSourceType'}
        uri_or_file_ref: {type: string, maxLength: 2048, description: 'https-URL (SSRF-проверка при загрузке), git URL или ссылка на загруженный
            artifact'}
        trust_level: {$ref: '#/components/schemas/DocumentationTrustLevel'}
        license_info: {type: string, maxLength: 2000}
        refresh_policy: {$ref: '#/components/schemas/DocumentationRefreshPolicy'}
        enabled: {type: boolean, default: true}
      required: [technology_version_id, source_type, uri_or_file_ref, trust_level]
      additionalProperties: false
      description: Регистрация НЕ загружает содержимое.
    RefreshAccepted:
      type: object
      properties:
        source_id: {type: string, format: uuid}
        external_action_id: {type: string, format: uuid}
        status:
          type: string
          enum: [QUEUED]
        accepted_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
      required: [source_id, external_action_id, status, accepted_at]
    AuditEvent:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        actor_type:
          type: string
          enum: [user, agent, system, github]
        actor_id:
          type: [string, 'null']
          format: uuid
        action: {type: string}
        resource_type: {type: string}
        resource_id: {type: string}
        metadata: {type: object, additionalProperties: true, description: 'request_id, ip (усечённый), outcome, idempotency_key hash;
            без секретов'}
        created_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
      required: [id, workspace_id, actor_type, action, resource_type, resource_id, metadata, created_at]
    AuditEventPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEvent'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница AuditEvent (cursor pagination).
    SearchResultType:
      type: string
      enum: [project, run, task, finding, approval, documentation_source, chat_message]
    SearchResult:
      type: object
      properties:
        type: {$ref: '#/components/schemas/SearchResultType'}
        id: {type: string, format: uuid}
        title: {type: string, maxLength: 201}
        snippet:
          type: [string, 'null']
          description: Окно текста вокруг совпадения (секреты редактируются); только текст
        score: {type: number, minimum: 0, maximum: 1}
        created_at: {type: string, format: date-time}
        project_id:
          type: [string, 'null']
          format: uuid
        run_id:
          type: [string, 'null']
          format: uuid
        task_id:
          type: [string, 'null']
          format: uuid
        api_path: {type: string, description: Путь API ресурса (подсказка маршрута)}
      required: [type, id, title, snippet, score, created_at, project_id, run_id, task_id, api_path]
    SearchResults:
      type: object
      properties:
        query: {type: string}
        types:
          type: array
          items: {$ref: '#/components/schemas/SearchResultType'}
          description: Типы, по которым выполнен поиск
        skipped_types:
          type: array
          items: {$ref: '#/components/schemas/SearchResultType'}
          description: Запрошенные типы, пропущенные из-за отсутствия права
        items:
          type: array
          items: {$ref: '#/components/schemas/SearchResult'}
          maxItems: 50
        truncated: {type: boolean, description: Совпадений больше, чем limit}
      required: [query, types, skipped_types, items, truncated]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, fail]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, fail]
          description: postgres, redis, object_storage, migrations — только статус, без деталей
      required: [status]
    SseEnvelope:
      type: object
      properties:
        event_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        seq: {type: integer, format: int64, minimum: 1}
        type: {$ref: '#/components/schemas/SseEventType'}
        timestamp: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        schema_version: {type: string, const: '1.0'}
        payload: {type: object, additionalProperties: true}
      required: [event_id, run_id, seq, type, timestamp, schema_version, payload]
      description: 'data: каждого SSE-события (кроме heartbeat). id: = seq.'
      discriminator:
        propertyName: type
        mapping: {run.state_changed: '#/components/schemas/SseRunStateChanged', task.state_changed: '#/components/schemas/SseTaskStateChanged',
          agent.message: '#/components/schemas/SseAgentMessage', cli.output: '#/components/schemas/SseCliOutput', directive.impact_ready: '#/components/schemas/SseDirectiveImpactReady',
          directive.state_changed: '#/components/schemas/SseDirectiveStateChanged', approval.requested: '#/components/schemas/SseApprovalRequested',
          approval.decided: '#/components/schemas/SseApprovalDecided', gate.completed: '#/components/schemas/SseGateCompleted', run.completed: '#/components/schemas/SseRunCompleted',
          chat.message: '#/components/schemas/SseChatMessage'}
    RunStateChangedPayload:
      type: object
      properties:
        from_status:
          oneOf:
          - {$ref: '#/components/schemas/RunStatus'}
          - {type: 'null'}
        to_status: {$ref: '#/components/schemas/RunStatus'}
        run_version: {type: integer, format: int64, minimum: 0, description: 'Версия run после перехода; ETag = "v<run_version>"'}
        blocked_reason:
          oneOf:
          - {$ref: '#/components/schemas/TaskBlockedReason'}
          - {type: 'null'}
        reason:
          type: [string, 'null']
      required: [from_status, to_status, run_version]
    TaskStateChangedPayload:
      type: object
      properties:
        task_id: {type: string, format: uuid}
        title: {type: string, maxLength: 500}
        agent_role: {$ref: '#/components/schemas/AgentRole'}
        from_status:
          oneOf:
          - {$ref: '#/components/schemas/TaskStatus'}
          - {type: 'null'}
        to_status: {$ref: '#/components/schemas/TaskStatus'}
        task_version: {type: integer, format: int64, minimum: 0, description: 'Версия задачи (на момент публикации события)'}
        attempt_no:
          type: [integer, 'null']
        provider:
          oneOf:
          - {$ref: '#/components/schemas/CliProvider'}
          - {type: 'null'}
        blocked_reason:
          oneOf:
          - {$ref: '#/components/schemas/TaskBlockedReason'}
          - {type: 'null'}
        failure_category:
          oneOf:
          - {$ref: '#/components/schemas/FailureCategory'}
          - {type: 'null'}
      required: [task_id, agent_role, from_status, to_status, task_version]
    AgentMessagePayload:
      type: object
      properties:
        message_id: {type: string, format: uuid}
        task_id:
          type: [string, 'null']
          format: uuid
        type: {$ref: '#/components/schemas/AcpMessageType'}
        from:
          type: object
          properties:
            role: {$ref: '#/components/schemas/AgentRole'}
            provider:
              oneOf:
              - {$ref: '#/components/schemas/CliProvider'}
              - {type: 'null'}
          required: [role]
        to:
          type: object
          properties:
            role: {$ref: '#/components/schemas/AgentRole'}
          required: [role]
        correlation_id:
          type: [string, 'null']
          format: uuid
        reply_to_id:
          type: [string, 'null']
          format: uuid
        summary: {type: string, maxLength: 2000}
        truncated: {type: boolean}
      required: [message_id, type, from, to, summary, truncated]
      description: Полный payload — GET /tasks/{task_id}/messages.
    CliOutputPayload:
      type: object
      additionalProperties: false
      description: >-
        Живой вывод CLI (API_DESIGN §14): санитизированное нормализованное событие исполнения. Нормативная схема —
        sse-event.schema.json `cli_output`. Не более 20 событий/с на run: избыток коалесцируется (`coalesced_count`,
        `dropped_chunks` > 0); полный санитизированный вывод — artifact `cli_output` (`artifact_id` события `finished`).
      properties:
        execution_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        provider: {$ref: '#/components/schemas/CliProvider'}
        agent_role: {$ref: '#/components/schemas/AgentRole'}
        cli_seq: {type: integer, minimum: 1, description: seq нормализованного события (последнего из коалесцированных)}
        cli_event_type: {$ref: '#/components/schemas/NormalizedCliEvent'}
        stream:
          type: string
          enum: [stdout, stderr, agent_message]
        text: {type: string, maxLength: 4096, description: Санитизированный текст (секреты отредактированы)}
        redactions: {type: integer, minimum: 0}
        truncated: {type: boolean}
        coalesced_count: {type: integer, minimum: 1}
        dropped_chunks: {type: integer, minimum: 0}
        tool_kind:
          type: string
          enum: [file_read, file_write, file_patch, command, search, network, other]
        tool_phase:
          type: string
          enum: [requested, started, completed, denied, failed]
        target: {type: string, maxLength: 1024}
        artifact_id: {type: string, format: uuid}
        warning_code: {type: string, maxLength: 50}
        execution_status:
          type: string
          enum: [EXITED, TIMED_OUT, CANCELLED, CRASHED, AUTH_REQUIRED, RATE_LIMITED]
      required: [execution_id, task_id, provider, agent_role, cli_seq, cli_event_type]
    DirectiveImpactReadyPayload:
      type: object
      properties:
        directive_id: {type: string, format: uuid}
        summary: {type: string, maxLength: 2000, description: Сводка анализа влияния (= Directive.impact_summary)}
        impacts:
          type: array
          maxItems: 500
          items:
            type: object
            properties:
              task_id:
                type: [string, 'null']
                format: uuid
                description: null для TASK_ADD (новая задача ещё не создана)
              impact_type: {$ref: '#/components/schemas/DirectiveImpactType'}
              resolution: {type: string, maxLength: 500}
            required: [task_id, impact_type]
        requires_confirmation: {type: boolean}
        approval_id:
          type: [string, 'null']
          format: uuid
        expected_run_version: {type: integer, minimum: 0}
      required: [directive_id, impacts, requires_confirmation, expected_run_version]
      description: Payload SSE (sse-event.schema.json#/$defs/directive_impact_ready); итоговое влияние — Directive.impact_status.
    DirectiveStateChangedPayload:
      type: object
      description: >-
        Переход Directive FSM либо изменение ack получателя (доменное `directive.ack_changed`: from_status = to_status,
        поле `recipients`). Нормативная схема — sse-event.schema.json `directive_state_changed`.
      properties:
        directive_id: {type: string, format: uuid}
        directive_type: {$ref: '#/components/schemas/DirectiveType'}
        from_status:
          oneOf:
          - {$ref: '#/components/schemas/DirectiveStatus'}
          - {type: 'null'}
        to_status: {$ref: '#/components/schemas/DirectiveStatus'}
        reason: {type: string, maxLength: 1000}
        recipients:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            properties:
              role: {$ref: '#/components/schemas/AgentRole'}
              ack_status:
                type: string
                enum: [PENDING, DELIVERED, ACKNOWLEDGED, REJECTED, EXPIRED, COMPLETED, FAILED]
              execution_id:
                type: [string, 'null']
                format: uuid
              at:
                type: [string, 'null']
                format: date-time
            required: [role, ack_status]
        acknowledgement:
          description: устарело (не выдаётся сервером); используйте `recipients`
          oneOf:
          - {$ref: '#/components/schemas/DirectiveAck'}
          - {type: 'null'}
      required: [directive_id, directive_type, from_status, to_status]
    ApprovalRequestedPayload:
      type: object
      properties:
        approval_id: {type: string, format: uuid}
        action_type: {$ref: '#/components/schemas/ApprovalActionType'}
        task_id:
          type: [string, 'null']
          format: uuid
        risk_level: {$ref: '#/components/schemas/RiskLevel'}
        summary: {type: string}
        expires_at:
          type: [string, 'null']
          format: date-time
      required: [approval_id, action_type, risk_level, summary]
    ApprovalDecidedPayload:
      type: object
      properties:
        approval_id: {type: string, format: uuid}
        action_type: {$ref: '#/components/schemas/ApprovalActionType'}
        status:
          type: string
          enum: [APPROVED, REJECTED, EXPIRED, CANCELLED]
        decided_by:
          type: [string, 'null']
          format: uuid
          description: id пользователя, принявшего решение (null — истечение/отмена системой); имя — GET /approvals/{approval_id}
        decision_reason:
          type: [string, 'null']
          maxLength: 2000
      required: [approval_id, action_type, status]
      description: Компактный payload SSE (sse-event.schema.json#/$defs/approval_decided); полное представление — Approval.
    GateCompletedPayload:
      type: object
      properties:
        gate_execution_id: {type: string, format: uuid}
        gate_type: {type: string}
        task_id:
          type: [string, 'null']
          format: uuid
        required: {type: boolean}
        status: {$ref: '#/components/schemas/GateExecutionStatus'}
        evidence_id:
          type: [string, 'null']
          format: uuid
        findings_count: {type: integer}
      required: [gate_execution_id, gate_type, required, status, findings_count]
    RunCompletedPayload:
      type: object
      properties:
        final_status:
          type: string
          enum: [COMPLETED, FAILED, CANCELLED]
        verdict:
          type: string
          enum: [PENDING, RUNNING, PASS, FAIL, ERROR]
        report_url: {type: string}
      required: [final_status, verdict, report_url]
      description: Терминальное событие run (COMPLETED/FAILED/CANCELLED); после него сервер закрывает поток.
    ChatMessagePayload:
      type: object
      properties:
        chat_message_id: {type: string, format: uuid, description: '= ChatItem.id'}
        thread_id: {type: string, format: uuid}
        scope:
          type: string
          enum: [RUN, ROLE, TASK]
        message_kind:
          type: string
          enum: [USER_TEXT, DIRECTIVE, AGENT_MESSAGE, CLI_HIGHLIGHT, STATUS, APPROVAL, DIRECTIVE_STATUS, SYSTEM_NOTICE]
          description: 'Вид события; соответствие ChatItem.item_type: USER_TEXT→chat_message, DIRECTIVE→directive, AGENT_MESSAGE→agent_message,
            CLI_HIGHLIGHT→cli_excerpt, APPROVAL→approval, прочие→system_event'
        sender_type: {$ref: '#/components/schemas/ChatSenderType'}
        sender_id:
          type: [string, 'null']
        sender_role:
          type: [string, 'null']
          description: Роль агента или ACP-участник (orchestrator)
        provider:
          oneOf:
          - {$ref: '#/components/schemas/CliProvider'}
          - {type: 'null'}
        task_id:
          type: [string, 'null']
          format: uuid
        target_role:
          oneOf:
          - {$ref: '#/components/schemas/AgentRole'}
          - {type: 'null'}
        mentions:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/AgentRole'}
        body: {type: string, maxLength: 8000}
        acp_type:
          oneOf:
          - {$ref: '#/components/schemas/AcpMessageType'}
          - {type: 'null'}
          description: '= ChatItem.acp_type (для AGENT_MESSAGE)'
        source_event_id:
          type: [string, 'null']
          format: uuid
        directive_id:
          type: [string, 'null']
          format: uuid
        approval_id:
          type: [string, 'null']
          format: uuid
        links:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [diff, test_report, evidence, finding, artifact, task, approval, gate_execution]
                description: '= ChatItem.refs[].type'
              id: {type: string, format: uuid}
            required: [kind, id]
        created_at: {type: string, format: date-time}
      required: [chat_message_id, thread_id, scope, message_kind, sender_type, body, created_at]
      description: 'Плоский payload SSE (sse-event.schema.json#/$defs/chat_message). Клиент сопоставляет его с ChatItem по id =
        chat_message_id; полное представление (UserRef, статусы поручения/approval) — GET /runs/{run_id}/chat.'
    SseRunStateChanged:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: run.state_changed}
          payload: {$ref: '#/components/schemas/RunStateChangedPayload'}
    SseTaskStateChanged:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: task.state_changed}
          payload: {$ref: '#/components/schemas/TaskStateChangedPayload'}
    SseAgentMessage:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: agent.message}
          payload: {$ref: '#/components/schemas/AgentMessagePayload'}
    SseCliOutput:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: cli.output}
          payload: {$ref: '#/components/schemas/CliOutputPayload'}
    SseDirectiveImpactReady:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: directive.impact_ready}
          payload: {$ref: '#/components/schemas/DirectiveImpactReadyPayload'}
    SseDirectiveStateChanged:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: directive.state_changed}
          payload: {$ref: '#/components/schemas/DirectiveStateChangedPayload'}
    SseApprovalRequested:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: approval.requested}
          payload: {$ref: '#/components/schemas/ApprovalRequestedPayload'}
    SseApprovalDecided:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: approval.decided}
          payload: {$ref: '#/components/schemas/ApprovalDecidedPayload'}
    SseGateCompleted:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: gate.completed}
          payload: {$ref: '#/components/schemas/GateCompletedPayload'}
    SseRunCompleted:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: run.completed}
          payload: {$ref: '#/components/schemas/RunCompletedPayload'}
    SseChatMessage:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: chat.message}
          payload: {$ref: '#/components/schemas/ChatMessagePayload'}
    SseHeartbeat:
      type: object
      properties:
        type: {const: heartbeat}
        timestamp: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        last_seq: {type: integer, format: int64}
      required: [type, timestamp, last_seq]
      description: 'Каждые 15 с; без id: (не сдвигает Last-Event-ID).'
    SseEvent:
      oneOf:
      - {$ref: '#/components/schemas/SseRunStateChanged'}
      - {$ref: '#/components/schemas/SseTaskStateChanged'}
      - {$ref: '#/components/schemas/SseAgentMessage'}
      - {$ref: '#/components/schemas/SseCliOutput'}
      - {$ref: '#/components/schemas/SseDirectiveImpactReady'}
      - {$ref: '#/components/schemas/SseDirectiveStateChanged'}
      - {$ref: '#/components/schemas/SseApprovalRequested'}
      - {$ref: '#/components/schemas/SseApprovalDecided'}
      - {$ref: '#/components/schemas/SseGateCompleted'}
      - {$ref: '#/components/schemas/SseRunCompleted'}
      - {$ref: '#/components/schemas/SseChatMessage'}
      - {$ref: '#/components/schemas/SseHeartbeat'}
      description: 'Значение поля data: SSE-кадра. event: = type.'
    WorkspaceSseEventType:
      type: string
      enum: [run.state_changed, approval.requested, approval.decided, run.completed, notification.created]
      description: 'Типы потока уведомлений workspace (streamWorkspaceEvents): подмножество SseEventType и notification.created
        (персональные уведомления, не тип журнала run).'
    WorkspaceSseHeartbeat:
      type: object
      properties:
        type: {const: heartbeat}
        workspace_id: {type: string, format: uuid}
        timestamp: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
      required: [type, workspace_id, timestamp]
      description: 'Каждые 15 с простоя; без id: (не сдвигает Last-Event-ID).'
    WorkspaceSseEvent:
      oneOf:
      - {$ref: '#/components/schemas/SseRunStateChanged'}
      - {$ref: '#/components/schemas/SseApprovalRequested'}
      - {$ref: '#/components/schemas/SseApprovalDecided'}
      - {$ref: '#/components/schemas/SseRunCompleted'}
      - {$ref: '#/components/schemas/SseNotificationCreated'}
      - {$ref: '#/components/schemas/WorkspaceSseHeartbeat'}
      description: 'Значение поля data: кадра потока workspace (streamWorkspaceEvents). event: = type; id: = курсор потока.'
    NotificationKind:
      type: string
      enum: [approval.requested, approval.decided, run.completed, run.failed, run.blocked, directive.awaiting_confirmation, directive.acknowledged,
        directive.completed, directive.failed, pull_request.merged, pull_request.failed, finding.critical]
      x-proposed-enum: true
      description: 'Вид уведомления (CHECK notifications.kind, миграция 0020). Источники и получатели — API_DESIGN §13.2.'
    NotificationSeverity:
      type: string
      enum: [info, success, warning, error]
      x-proposed-enum: true
      description: Важность уведомления для UI.
    NotificationResourceType:
      type: string
      enum: [approval, run, directive, gate_execution, external_action]
      x-proposed-enum: true
      description: Тип ресурса, на который ссылается уведомление (resource_id).
    Notification:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/NotificationKind'}
        severity: {$ref: '#/components/schemas/NotificationSeverity'}
        title: {type: string, minLength: 1, maxLength: 200, description: Шаблонный заголовок}
        body: {type: string, maxLength: 1000, description: 'Редактированная выжимка (цель run, описание запроса); без секретов'}
        project_id:
          type: [string, 'null']
          format: uuid
        run_id:
          type: [string, 'null']
          format: uuid
        task_id:
          type: [string, 'null']
          format: uuid
        resource_type: {$ref: '#/components/schemas/NotificationResourceType'}
        resource_id: {type: string, format: uuid}
        data:
          type: object
          additionalProperties:
            type: [string, number, integer, boolean, 'null']
          maxProperties: 12
          description: 'Скалярные подробности вида (action_type, status, final_status, blocked_reason, directive_type, critical, gate_type,
            external_ref)'
        created_at: {type: string, format: date-time}
        read_at:
          type: [string, 'null']
          format: date-time
        read: {type: boolean}
      required: [id, kind, severity, title, body, project_id, run_id, task_id, resource_type, resource_id, data, created_at, read_at,
        read]
      additionalProperties: false
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Notification'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
        unread_count: {type: integer, minimum: 0}
      required: [items, next_cursor, unread_count]
      description: Страница уведомлений (cursor pagination), новые сверху.
    NotificationUnreadCount:
      type: object
      properties:
        unread_count: {type: integer, minimum: 0}
        latest_unread_at:
          type: [string, 'null']
          format: date-time
      required: [unread_count, latest_unread_at]
    NotificationMarkReadRequest:
      type: object
      properties:
        notification_ids:
          type: array
          items: {type: string, format: uuid}
          minItems: 1
          maxItems: 100
        up_to: {type: string, format: uuid, description: 'Отметить все уведомления до этого включительно (created_at, id)'}
        all: {type: boolean, const: true}
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      description: Ровно одно из полей.
    NotificationMarkReadResult:
      type: object
      properties:
        marked: {type: integer, minimum: 0, description: Число уведомлений, отмеченных этим запросом}
        unread_count: {type: integer, minimum: 0}
      required: [marked, unread_count]
    SseNotificationCreated:
      type: object
      properties:
        event_id: {type: string, format: uuid, description: '= Notification.id (дедупликация клиентом)'}
        run_id:
          type: [string, 'null']
          format: uuid
        seq: {type: 'null', description: Уведомления не имеют seq run}
        type: {const: notification.created}
        timestamp: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z (= created_at)'}
        schema_version: {type: string, const: '1.0'}
        payload: {$ref: '#/components/schemas/Notification'}
      required: [event_id, run_id, seq, type, timestamp, schema_version, payload]
      additionalProperties: false
      description: 'Кадр потока workspace с новым уведомлением текущего пользователя (схема packages/contracts/schemas/events/1.0/notification-event.schema.json).
        id: = курсор потока (время создания уведомления, микросекунды epoch).'
