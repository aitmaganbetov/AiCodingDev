        внутри фильтра). `after_seq` — исключающая нижняя граница; `cursor` продолжает выборку после `seq` последнего элемента
        страницы (при наличии `cursor` параметр `after_seq` игнорируется). События, удалённые retention, не возвращаются.'
      parameters:
