          - {type: 'null'}
        directive_id:
          type: [string, 'null']
          format: uuid
        directive_status:
          oneOf:
          - {$ref: '#/components/schemas/DirectiveStatus'}
          - {type: 'null'}
        approval_id:
          type: [string, 'null']
          format: uuid
        approval_status:
          oneOf:
          - {$ref: '#/components/schemas/ApprovalStatus'}
          - {type: 'null'}
