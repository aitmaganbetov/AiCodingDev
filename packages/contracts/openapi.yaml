          items: {$ref: '#/components/schemas/FieldError'}
        current_version: {type: integer, description: Для version_mismatch/precondition_failed}
        current_status: {type: string, description: Для invalid_state_transition}
        retry_after_seconds: {type: integer}
        last_seq: {type: integer, format: int64, minimum: 0, description: 'Для replay_window_exceeded (410): текущий максимальный seq run — переподключение с after_seq=last_seq (API_DESIGN §13)'}
        min_available_seq: {type: integer, format: int64, minimum: 0, description: 'Для replay_window_exceeded (410): наименьший seq, ещё доступный для replay'}
        max_age_seconds: {type: integer, minimum: 1, description: 'Для step_up_required (403): допустимый возраст последнего ввода пароля (SC-IAM-08); подтверждение — POST /auth/reauthenticate'}
      required: [type, title, status, code]
      description: RFC 7807 application/problem+json
    FieldError:
      type: object
      properties:
        pointer:
          type: string
          description: 'Расположение ошибочного значения. Для тела запроса — JSON Pointer (RFC 6901) относительно корня тела: "/name",
            "/items/0/slug"; "" — тело целиком. Для параметров — "query:<имя>" (напр. "query:limit") или "header:<имя>" (напр. "header:Idempotency-Key").'
          examples: [/name, /items/0/slug, 'query:limit', 'header:Idempotency-Key']
        code: {type: string}
        message: {type: string}
      required: [pointer, code]
    UserRef:
      type: object
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
      required: [id, display_name]
    Links:
      type: object
      additionalProperties: {type: string}
      description: Ссылки на связанные ресурсы (относительные URI)
    CommandBody:
      type: object
      properties:
        reason: {type: string, maxLength: 2000}
      additionalProperties: false
      description: Необязательное тело команд pause/resume/cancel/confirm/cancel-directive.
    LoginRequest:
      type: object
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
      required: [email, password]
      additionalProperties: false
    ReauthenticateRequest:
      type: object
      properties:
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
      required: [password]
      additionalProperties: false
    WorkspaceMembership:
      type: object
      properties:
        workspace_id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
      required: [workspace_id, slug, name, role]
    SessionInfo:
      type: object
      properties:
        user:
          type: object
          properties:
            id: {type: string, format: uuid}
            email: {type: string, format: email}
            display_name: {type: string}
          required: [id, email, display_name]
        csrf_token: {type: string, description: Значение для заголовка X-CSRF-Token (также в cookie aicd_csrf)}
        expires_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        idle_expires_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        reauthenticated_at:
          type: [string, 'null']
          format: date-time
          description: 'Последний ввод пароля в сессии (вход или step-up, SC-IAM-08); step-up действителен 10 минут'
        workspaces:
          type: array
          items: {$ref: '#/components/schemas/WorkspaceMembership'}
      required: [user, csrf_token, expires_at, workspaces]
    Workspace:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        settings: {$ref: '#/components/schemas/WorkspaceSettings'}
        version:
          type: integer
          format: int64
          minimum: 0
          description: 'Версия для If-Match (ETag `"v<version>"`); присутствует в ответах getWorkspace/updateWorkspace/createWorkspace'
        created_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
      required: [id, name, slug, role, created_at]
    WorkspaceSettings:
      type: object
      properties:
        allow_single_member_self_approval:
          type: boolean
          description: 'Исключение four-eyes для workspace с единственным участником (API_DESIGN §5.3); по умолчанию false. Меняет только
            owner.'
      additionalProperties: true
      description: Настройки и политики workspace; неизвестные ключи клиент игнорирует (API_DESIGN §16).
    WorkspaceUpdateRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        settings: {$ref: '#/components/schemas/WorkspaceSettingsUpdate'}
      minProperties: 1
      additionalProperties: false
      description: Merge-patch workspace (OQ-45 (f)); slug неизменяем.
    WorkspaceSettingsUpdate:
      type: object
      properties:
        allow_single_member_self_approval: {type: boolean}
      minProperties: 1
      additionalProperties: false
    WorkspaceCreateRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$', description: '2–63 символа: a-z, 0-9 и дефис, без дефиса в начале и
            конце (подмножество CHECK БД workspaces.slug).'}
      required: [name, slug]
      additionalProperties: false
    WorkspacePage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Workspace'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница Workspace (cursor pagination).
    Member:
      type: object
      properties:
        user: {$ref: '#/components/schemas/UserRef'}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        joined_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        version: {type: integer, format: int64, minimum: 0, description: Optimistic locking version; ETag = "v<version>"}
      required: [user, email, role, joined_at, version]
    MemberPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Member'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница Member (cursor pagination).
    MemberCreateRequest:
      type: object
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
      required: [email, role]
      additionalProperties: false
      description: Добавляет существующего локального пользователя. Приглашения по email — вне v1.
    MemberUpdateRequest:
      type: object
      properties:
        role: {$ref: '#/components/schemas/WorkspaceRole'}
      required: [role]
      additionalProperties: false
    Project:
      type: object
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        name: {type: string}
        description:
          type: [string, 'null']
        status: {$ref: '#/components/schemas/ProjectStatus'}
        settings: {$ref: '#/components/schemas/ProjectSettings'}
        version: {type: integer, format: int64, minimum: 0, description: Optimistic locking version; ETag = "v<version>"}
        created_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        updated_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
      required: [id, workspace_id, name, status, settings, version, created_at, updated_at]
    ProjectSettings:
      type: object
      properties:
        documentation_mode: {$ref: '#/components/schemas/DocumentationMode'}
        quality_profile: {$ref: '#/components/schemas/QualityProfile'}
        routing_policy_id:
          type: [string, 'null']
          format: uuid
        security_profile:
          type: [string, 'null']
        settings_version: {type: integer, format: int64, minimum: 0, description: Optimistic locking version; ETag = "v<version>"}
      required: [documentation_mode, quality_profile, settings_version]
    ProjectPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Project'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница Project (cursor pagination).
    ProjectCreateRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 4000}
        documentation_mode: {$ref: '#/components/schemas/DocumentationMode'}
        quality_profile: {$ref: '#/components/schemas/QualityProfile'}
      required: [name]
      additionalProperties: false
      description: workspace берётся из X-Workspace-Id. По умолчанию documentation_mode=SMART, quality_profile=strict.
    ProjectUpdateRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description:
          type: [string, 'null']
          maxLength: 4000
        status: {$ref: '#/components/schemas/ProjectStatus'}
        quality_profile: {$ref: '#/components/schemas/QualityProfile'}
        routing_policy_id:
          type: [string, 'null']
          format: uuid
      additionalProperties: false
      description: JSON merge-patch семантика (application/json). Требует If-Match.
      minProperties: 1
    Repository:
      type: object
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        provider: {$ref: '#/components/schemas/RepositoryProvider'}
        remote_url:
          type: [string, 'null']
        default_branch: {type: string}
        local_root_ref:
          type: [string, 'null']
        last_synced_at:
          type: [string, 'null']
          format: date-time
        latest_index_snapshot:
          oneOf:
          - type: object
            properties:
              snapshot_id: {type: string, format: uuid}
              commit_sha: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
              status: {type: string}
            required: [snapshot_id, commit_sha, status]
          - {type: 'null'}
      required: [id, project_id, provider, default_branch]
    RepositoryTreeEntry:
      type: object
      properties:
        name: {type: string}
        path: {type: string, description: Путь от корня репозитория}
        type: {type: string, enum: [directory, file, symlink, submodule]}
        mode: {type: string, description: Режим git (100644, 100755, 120000, 040000, 160000)}
        size:
          type: [integer, 'null']
          minimum: 0
          description: Размер blob в байтах; null для каталога/submodule
      required: [name, path, type, mode, size]
    RepositoryTreePage:
      type: object
      properties:
        repository_id: {type: string, format: uuid}
        commit_sha: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
        path: {type: string, description: Нормализованный путь каталога ('' — корень)}
        items:
          type: array
          items: {$ref: '#/components/schemas/RepositoryTreeEntry'}
        next_cursor:
          type: [string, 'null']
      required: [repository_id, commit_sha, path, items, next_cursor]
    RepositoryFile:
      type: object
      properties:
        repository_id: {type: string, format: uuid}
        commit_sha: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
        path: {type: string}
        type: {type: string, enum: [file, symlink]}
        mode: {type: string}
        size: {type: integer, minimum: 0, description: Полный размер blob в байтах}
        max_bytes: {type: integer, minimum: 1, description: Лимит отдаваемого содержимого}
        truncated: {type: boolean, description: Содержимое усечено до max_bytes}
        is_binary: {type: boolean}
        encoding:
          type: [string, 'null']
          enum: [utf-8, null]
        content:
          type: [string, 'null']
          description: Текст файла (усечённый при truncated); null для бинарного файла. Отображается только как текст.
      required: [repository_id, commit_sha, path, type, mode, size, max_bytes, truncated, is_binary, encoding, content]
    RepositoryBranch:
      type: object
      properties:
        name: {type: string, description: Имя ветки без refs/heads/}
        commit_sha: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
        committed_at:
          type: [string, 'null']
          format: date-time
        is_default: {type: boolean}
      required: [name, commit_sha, committed_at, is_default]
    RepositoryBranchPage:
      type: object
      properties:
        repository_id: {type: string, format: uuid}
        default_branch: {type: string}
        truncated: {type: boolean, description: В репозитории больше веток, чем отображается (лимит 1000)}
        items:
          type: array
          items: {$ref: '#/components/schemas/RepositoryBranch'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [repository_id, default_branch, truncated, items, next_cursor]
    RepositoryCommitSummary:
      type: object
      properties:
        sha: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
        parents:
          type: array
          items: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
        author_name: {type: string, maxLength: 200}
        authored_at:
          type: [string, 'null']
          format: date-time
        committed_at:
          type: [string, 'null']
          format: date-time
        subject: {type: string, maxLength: 500, description: Первая строка сообщения commit (секреты редактируются); только текст}
      required: [sha, parents, author_name, authored_at, committed_at, subject]
    RepositoryCommitPage:
      type: object
      properties:
        repository_id: {type: string, format: uuid}
        commit_sha: {type: string, description: Полный SHA, от которого строится история}
        items:
          type: array
          items: {$ref: '#/components/schemas/RepositoryCommitSummary'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки (или лимит глубины 1000).
      required: [repository_id, commit_sha, items, next_cursor]
    RepositoryPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Repository'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница Repository (cursor pagination).
    RepositoryAttachRequest:
      type: object
      properties:
        provider: {$ref: '#/components/schemas/RepositoryProvider'}
        remote_url: {type: string, maxLength: 2048, description: 'Для github: https://github.com/<owner>/<repo>'}
        local_path: {type: string, maxLength: 4096, description: 'Для local: путь внутри разрешённых корней (allowlist); иначе 422'}
        default_branch: {type: string, maxLength: 255}
      required: [provider]
      additionalProperties: false
      description: 'provider=local требует local_path; provider=github (P8-02, FR-PRJ-03) требует remote_url, local_path (локальная рабочая
        копия в allowlist-корнях) и активную установку GitHub App workspace с доступом к репозиторию (проверяется через GitHub API).'
    Technology:
      type: object
      properties:
        technology_id: {type: string, format: uuid}
        name: {type: string}
        ecosystem: {type: string}
        technology_version_id: {type: string, format: uuid}
        version_label: {type: string}
        support_status:
          type: [string, 'null']
        detected_from:
          type: [string, 'null']
        confirmed_by:
          oneOf:
          - {$ref: '#/components/schemas/UserRef'}
          - {type: 'null'}
      required: [technology_id, name, ecosystem, technology_version_id, version_label]
    TechnologyPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Technology'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница Technology (cursor pagination).
    WorkspaceTechnology:
      type: object
      properties:
        technology_id: {type: string, format: uuid}
        name: {type: string}
        ecosystem: {type: string}
        technology_version_id: {type: string, format: uuid}
        version_label: {type: string}
        support_status:
          type: [string, 'null']
        project_count: {type: integer, minimum: 0, description: Проекты workspace с этой версией в определённом стеке}
        source_count: {type: integer, minimum: 0, description: Источники документации workspace для этой версии}
      required: [technology_id, name, ecosystem, technology_version_id, version_label, support_status, project_count, source_count]
    WorkspaceTechnologyPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/WorkspaceTechnology'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница WorkspaceTechnology (cursor pagination).
    DocumentationPolicy:
      type: object
      properties:
        project_id: {type: string, format: uuid}
        documentation_mode: {$ref: '#/components/schemas/DocumentationMode'}
        settings_version: {type: integer, format: int64, minimum: 0, description: Optimistic locking version; ETag = "v<version>"}
      required: [project_id, documentation_mode, settings_version]
    DocumentationPolicyUpdateRequest:
      type: object
      properties:
        documentation_mode: {$ref: '#/components/schemas/DocumentationMode'}
      required: [documentation_mode]
      additionalProperties: false
    RunRouting:
      type: object
      properties:
        strategy:
          type: string
          enum: [adaptive, fixed]
          default: adaptive
        allowed_providers:
          type: array
          items: {$ref: '#/components/schemas/CliProvider'}
          minItems: 1
          uniqueItems: true
      required: [strategy]
      additionalProperties: false
    RunCreateRequest:
      type: object
      properties:
        project_id: {type: string, format: uuid}
        mode: {$ref: '#/components/schemas/RunMode'}
        objective: {type: string, minLength: 1, maxLength: 20000}
        routing: {$ref: '#/components/schemas/RunRouting'}
        quality_profile: {$ref: '#/components/schemas/QualityProfile'}
        approval_policy:
          type: string
          enum: [risk_based, always, critical_only]
          default: risk_based
      required: [project_id, mode, objective]
      additionalProperties: false
      description: 'ТЗ §8.1. repository_id не передаётся: в v1 проект с одним репозиторием (иначе 422) — см. API_DESIGN.md §19.'
    RunCreated:
      type: object
      properties:
        run_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/RunStatus'}
        event_stream: {type: string, example: '/api/v1/runs/{run_id}/events'}
      required: [run_id, status, event_stream]
      description: ТЗ §8.1, 201 Created
    RunSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        mode: {$ref: '#/components/schemas/RunMode'}
        objective: {type: string}
        status: {$ref: '#/components/schemas/RunStatus'}
        blocked_reason:
          oneOf:
          - {$ref: '#/components/schemas/TaskBlockedReason'}
          - {type: 'null'}
        requested_by: {$ref: '#/components/schemas/UserRef'}
        quality_profile: {$ref: '#/components/schemas/QualityProfile'}
        version: {type: integer, format: int64, minimum: 0, description: Optimistic locking version; ETag = "v<version>"}
        created_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
      required: [id, project_id, workspace_id, mode, objective, status, requested_by, quality_profile, version, created_at]
    Run:
      allOf:
      - {$ref: '#/components/schemas/RunSummary'}
      - type: object
        properties:
          repository_id: {type: string, format: uuid}
          base_commit_sha:
            type: [string, 'null']
            pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
          approval_policy: {type: string}
          plan_version: {type: integer}
          routing:
            type: object
            properties:
              strategy: {type: string}
              allowed_providers:
                type: array
                items: {$ref: '#/components/schemas/CliProvider'}
          task_counts:
            type: object
            additionalProperties: {type: integer}
            description: task_status → count
          pending_approvals: {type: integer}
          updated_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
          links: {$ref: '#/components/schemas/Links'}
    RunPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RunSummary'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница RunSummary (cursor pagination).
    RunCommandAccepted:
      type: object
      properties:
        run_id: {type: string, format: uuid}
        command:
          type: string
          enum: [pause, resume, cancel]
        status: {$ref: '#/components/schemas/RunStatus'}
        version: {type: integer, format: int64, minimum: 0, description: Optimistic locking version; ETag = "v<version>"}
        accepted_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
      required: [run_id, command, status, version, accepted_at]
      description: '202: команда принята; фактический переход (через safe checkpoint) публикуется событием run.state_changed.'
    TaskSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        agent_role: {$ref: '#/components/schemas/AgentRole'}
        title: {type: string}
        status: {$ref: '#/components/schemas/TaskStatus'}
        blocked_reason:
          oneOf:
          - {$ref: '#/components/schemas/TaskBlockedReason'}
          - {type: 'null'}
        complexity: {$ref: '#/components/schemas/ComplexityLevel'}
        risk_level: {$ref: '#/components/schemas/RiskLevel'}
        current_provider:
          oneOf:
          - {$ref: '#/components/schemas/CliProvider'}
          - {type: 'null'}
        attempt_count: {type: integer}
        max_attempts: {type: integer}
        depends_on:
          type: array
          items: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0, description: Optimistic locking version; ETag = "v<version>"}
        updated_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
      required: [id, run_id, agent_role, title, status, complexity, risk_level, attempt_count, max_attempts, depends_on, version, updated_at]
    TaskDependency:
      type: object
      properties:
        task_id: {type: string, format: uuid}
        depends_on_task_id: {type: string, format: uuid}
        dependency_type: {type: string}
      required: [task_id, depends_on_task_id, dependency_type]
    TaskGraph:
      type: object
      properties:
        run_id: {type: string, format: uuid}
        plan_version: {type: integer}
        tasks:
          type: array
          items: {$ref: '#/components/schemas/TaskSummary'}
        edges:
          type: array
          items: {$ref: '#/components/schemas/TaskDependency'}
        next_cursor:
          type: [string, 'null']
      required: [run_id, plan_version, tasks, edges, next_cursor]
