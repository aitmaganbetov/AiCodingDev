  /projects/{project_id}/pull-requests/{pull_request_id}/merge-request:
    post:
      operationId: requestPullRequestMerge
      summary: Запросить merge PR (approval MERGE, AC-13) [дополнение к ТЗ]
      tags: [github]
      description: 'Создаёт approval MERGE (admin, four-eyes: инициатор не может утвердить) на конкретный предмет — PR, head SHA,
        базовая ветка, метод. После APPROVED воркер перечитывает PR и защиту ветки через GitHub API и выполняет merge только при
        выполненных required checks и mergeable_state без обхода branch protection и без admin merge; head SHA сдвинулся ⇒ нужен новый
        approval. Повтор для того же предмета возвращает тот же PENDING approval.'
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/PullRequestId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PullRequestMergeRequest'}
      responses:
        '202':
          description: Approval MERGE запрошен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PullRequestMergeAccepted'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: pull_request:merge
      x-audit-action: github.pr.merge_request
      x-tz-addition: true
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: aicd_session, description: 'Серверная сессия (ADR-0009), HttpOnly, Secure, SameSite=Strict'}
    csrfHeader: {type: apiKey, in: header, name: X-CSRF-Token, description: Double-submit CSRF token; обязателен для POST/PATCH/PUT/DELETE}
  parameters:
    WorkspaceHeader:
      name: X-Workspace-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Tenant для коллекций без родительского ресурса. Не член workspace ⇒ 404.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 255, pattern: '^[A-Za-z0-9._:-]+$'}
      description: Обязателен для POST-команд. Хранится 24 ч в scope (workspace, user).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, example: '"v12"'}
      description: Сильный ETag текущей версии. Отсутствует ⇒ 428, не совпадает ⇒ 412.
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema: {type: string}
      description: Необязательный ETag run для защиты от устаревшего UI.
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 1024}
      description: Opaque cursor из next_cursor
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RepositoryId:
      name: repository_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RepositoryCommit:
      name: commit
      in: query
      description: 'Commit: hex SHA (7–64 символа, сокращённый допускается) или имя ветки (только refs/heads/). Без параметра —
        HEAD ветки по умолчанию, иначе последний READY-снимок индекса. Неверный формат — 422, отсутствующий commit — 404.'
      schema: {type: string, minLength: 1, maxLength: 255}
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DirectiveId:
      name: directive_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SourceId:
      name: source_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    EvidenceId:
      name: evidence_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    FindingId:
      name: finding_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ControlId:
      name: control_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    GitHubInstallationRef:
      name: github_installation_id
      in: path
      required: true
      description: id строки установки в платформе (не числовой installation_id GitHub)
      schema: {type: string, format: uuid}
    PullRequestId:
      name: pull_request_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    ETag:
      description: Сильный ETag "v<version>"
      schema: {type: string}
    Location:
      description: URI созданного ресурса
      schema: {type: string}
    RateLimitLimit:
      description: Квота окна
      schema: {type: integer}
    RateLimitRemaining:
      description: Остаток квоты
      schema: {type: integer}
    RateLimitReset:
      description: Секунд до сброса окна
      schema: {type: integer}
    RetryAfter:
      description: Секунд до повтора
      schema: {type: integer}
    IdempotencyReplayed:
      description: true — ответ воспроизведён из idempotency-хранилища
      schema: {type: boolean}
    SetCookie:
      description: aicd_session (HttpOnly; Secure; SameSite=Strict; Path=/api) и aicd_csrf (Secure; SameSite=Strict; не HttpOnly)
      schema: {type: string}
  responses:
    BadRequest:
      description: 400 malformed_request | idempotency_key_missing
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: 401 unauthenticated | session_expired
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: 403 forbidden | csrf_failed | four_eyes_violation | policy_denied
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: 404 not_found (включая чужой workspace — защита от перечисления)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: 409 conflict | version_mismatch | invalid_state_transition | idempotency_key_in_flight | last_owner
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: 412 precondition_failed (If-Match не совпал)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
    PreconditionRequired:
      description: 428 precondition_required (нет If-Match)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: 422 validation_error | idempotency_key_reuse | invalid_cursor
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: 429 rate_limited
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
        RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
    InternalError:
      description: 500 internal_error (непредвиденная ошибка; в теле только общий текст и request_id)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: 503 provider_unavailable | service_unavailable
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
  schemas:
    GitHubInstallation:
      type: object
      properties:
        id: {type: string, format: uuid}
        installation_id: {type: integer, minimum: 1}
        account_login: {type: string}
        account_type: {type: string, enum: [user, organization]}
        repository_selection: {type: string, enum: [all, selected]}
        permissions:
          type: object
          additionalProperties: {type: string}
          description: Права установки (подмножество минимального набора App, SC-GH-04)
        status: {type: string, enum: [ACTIVE, SUSPENDED, REVOKED]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      required: [id, installation_id, account_login, account_type, repository_selection, permissions, status, created_at, updated_at]
    GitHubVerification:
      type: object
      description: Проверка GitHub App на воркере (OQ-47 (2)) — подключение установки или доступ установки к репозиторию.
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [installation, repository]}
        status: {type: string, enum: [PENDING, SUCCEEDED, FAILED]}
        project_id:
          type: [string, 'null']
          format: uuid
        result_id:
          type: [string, 'null']
          format: uuid
          description: SUCCEEDED — id установки (kind=installation) или репозитория (kind=repository)
        error:
          oneOf:
          - type: 'null'
          - type: object
            properties:
              code: {type: string}
              detail: {type: [string, 'null']}
            required: [code, detail]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at:
          type: [string, 'null']
          format: date-time
      required: [id, kind, status, project_id, result_id, error, created_at, updated_at, completed_at]
    GitHubInstallationList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GitHubInstallation'}
      required: [items]
    GitHubInstallationSetup:
      type: object
      properties:
        install_url: {type: string, description: URL установки App на GitHub со state}
        state: {type: string}
        expires_at: {type: string, format: date-time}
      required: [install_url, state, expires_at]
    GitHubInstallationConnectRequest:
      type: object
      properties:
        installation_id: {type: integer, minimum: 1, maximum: 9007199254740992}
        state: {type: string, minLength: 1, maxLength: 1024}
        setup_action: {type: string, enum: [install, update]}
      required: [installation_id, state]
      additionalProperties: false
    GitHubWebhookAck:
      type: object
      properties:
        status: {type: string, enum: [accepted, ignored, duplicate]}
      required: [status]
    PullRequestState:
      type: string
      enum: [OPEN, CLOSED, MERGED]
    PullRequest:
      type: object
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        repository_id: {type: string, format: uuid}
        repository_full_name: {type: string}
        run_id:
          type: [string, 'null']
          format: uuid
        pr_number: {type: integer, minimum: 1}
        url: {type: string}
        state: {$ref: '#/components/schemas/PullRequestState'}
        head_branch: {type: string}
        base_branch: {type: string}
