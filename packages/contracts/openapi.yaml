      required: [id, run_id, kind, producer, verification_status, artifact, created_at]
      description: 'AC-14: commit, command, exit code, время, checksum.'
    EvidencePage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Evidence'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница Evidence (cursor pagination).
    GateExecution:
      type: object
      properties:
        id: {type: string, format: uuid}
        gate_id: {type: string, format: uuid}
        gate_type: {type: string}
