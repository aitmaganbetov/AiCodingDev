              - {type: 'null'}
            role:
              oneOf:
              - {$ref: '#/components/schemas/AgentRole'}
              - {type: 'null'}
          required: [actor_type]
        decided_by:
          oneOf:
          - {$ref: '#/components/schemas/UserRef'}
          - {type: 'null'}
        decision_reason:
          type: [string, 'null']
        can_decide: {type: boolean, description: Может ли текущий пользователь принять решение (RBAC + four-eyes)}
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        decided_at:
