        rationale:
          type: [string, 'null']
        agent_role:
          oneOf:
          - {$ref: '#/components/schemas/AgentRole'}
          - {type: 'null'}
          description: Ответственная роль (переопределение проекта или роль контроля по умолчанию)
        blocking:
          type: [boolean, 'null']
          description: Явное значение project_controls.blocking; null — умолчание платформы
