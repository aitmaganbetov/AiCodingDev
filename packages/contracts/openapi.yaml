      tags: [github]
      description: 'Вызывается UI со страницы Setup URL App с installation_id и state из startGitHubInstallation. Сервер проверяет state
        (HMAC, workspace и пользователь сессии, срок, однократность) и регистрирует установку в статусе PENDING (поля аккаунта и
        права — заглушки до проверки) с verification_id; проверку через GitHub API (JWT App) выполняет воркер (OQ-47 (2): процесс API
