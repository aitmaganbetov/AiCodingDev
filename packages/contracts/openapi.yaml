        propertyName: type
        mapping: {run.state_changed: '#/components/schemas/SseRunStateChanged', task.state_changed: '#/components/schemas/SseTaskStateChanged',
          agent.message: '#/components/schemas/SseAgentMessage', cli.output: '#/components/schemas/SseCliOutput', directive.impact_ready: '#/components/schemas/SseDirectiveImpactReady',
          directive.state_changed: '#/components/schemas/SseDirectiveStateChanged', approval.requested: '#/components/schemas/SseApprovalRequested',
          approval.decided: '#/components/schemas/SseApprovalDecided', gate.completed: '#/components/schemas/SseGateCompleted', run.completed: '#/components/schemas/SseRunCompleted',
          chat.message: '#/components/schemas/SseChatMessage'}
    RunStateChangedPayload:
      type: object
      properties:
        from_status:
          oneOf:
          - {$ref: '#/components/schemas/RunStatus'}
          - {type: 'null'}
        to_status: {$ref: '#/components/schemas/RunStatus'}
        run_version: {type: integer, format: int64, minimum: 0, description: 'Версия run после перехода; ETag = "v<run_version>"'}
        blocked_reason:
          oneOf:
          - {$ref: '#/components/schemas/TaskBlockedReason'}
          - {type: 'null'}
        reason:
          type: [string, 'null']
      required: [from_status, to_status, run_version]
    TaskStateChangedPayload:
      type: object
      properties:
        task_id: {type: string, format: uuid}
        title: {type: string, maxLength: 500}
        agent_role: {$ref: '#/components/schemas/AgentRole'}
        from_status:
          oneOf:
          - {$ref: '#/components/schemas/TaskStatus'}
          - {type: 'null'}
        to_status: {$ref: '#/components/schemas/TaskStatus'}
        task_version: {type: integer, format: int64, minimum: 0, description: 'Версия задачи (на момент публикации события)'}
        attempt_no:
          type: [integer, 'null']
        provider:
          oneOf:
          - {$ref: '#/components/schemas/CliProvider'}
          - {type: 'null'}
        blocked_reason:
          oneOf:
          - {$ref: '#/components/schemas/TaskBlockedReason'}
          - {type: 'null'}
        failure_category:
          oneOf:
          - {$ref: '#/components/schemas/FailureCategory'}
          - {type: 'null'}
      required: [task_id, agent_role, from_status, to_status, task_version]
    AgentMessagePayload:
      type: object
      properties:
        message_id: {type: string, format: uuid}
        task_id:
          type: [string, 'null']
          format: uuid
        type: {$ref: '#/components/schemas/AcpMessageType'}
        from:
          type: object
          properties:
            role: {$ref: '#/components/schemas/AgentRole'}
            provider:
              oneOf:
              - {$ref: '#/components/schemas/CliProvider'}
              - {type: 'null'}
          required: [role]
        to:
          type: object
          properties:
            role: {$ref: '#/components/schemas/AgentRole'}
          required: [role]
        correlation_id:
          type: [string, 'null']
          format: uuid
        reply_to_id:
          type: [string, 'null']
          format: uuid
        summary: {type: string, maxLength: 2000}
        truncated: {type: boolean}
      required: [message_id, type, from, to, summary, truncated]
      description: Полный payload — GET /tasks/{task_id}/messages.
    CliOutputPayload:
      type: object
      properties:
        execution_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        provider: {$ref: '#/components/schemas/CliProvider'}
        agent_role: {$ref: '#/components/schemas/AgentRole'}
        normalized_event: {$ref: '#/components/schemas/NormalizedCliEvent'}
        stream:
          type: string
          enum: [stdout, stderr, normalized]
        chunk_index: {type: integer, minimum: 0}
        text: {type: string, maxLength: 8192, description: ≤ 8 KiB UTF-8 после редактирования секретов}
        redactions: {type: integer, minimum: 0}
        truncated: {type: boolean}
        dropped_chunks: {type: integer, minimum: 0}
        artifact_id:
          type: [string, 'null']
          format: uuid
      required: [execution_id, task_id, provider, normalized_event, chunk_index, text, redactions, truncated]
    DirectiveImpactReadyPayload:
      type: object
      properties:
        directive_id: {type: string, format: uuid}
        summary: {type: string, maxLength: 2000, description: Сводка анализа влияния (= Directive.impact_summary)}
        impacts:
          type: array
          maxItems: 500
          items:
            type: object
            properties:
              task_id:
                type: [string, 'null']
                format: uuid
                description: null для TASK_ADD (новая задача ещё не создана)
              impact_type: {$ref: '#/components/schemas/DirectiveImpactType'}
              resolution: {type: string, maxLength: 500}
            required: [task_id, impact_type]
        requires_confirmation: {type: boolean}
        approval_id:
          type: [string, 'null']
          format: uuid
        expected_run_version: {type: integer, minimum: 0}
      required: [directive_id, impacts, requires_confirmation, expected_run_version]
      description: Payload SSE (sse-event.schema.json#/$defs/directive_impact_ready); итоговое влияние — Directive.impact_status.
    DirectiveStateChangedPayload:
      type: object
      description: >-
        Переход Directive FSM либо изменение ack получателя (доменное `directive.ack_changed`: from_status = to_status,
        поле `recipients`). Нормативная схема — sse-event.schema.json `directive_state_changed`.
      properties:
        directive_id: {type: string, format: uuid}
        directive_type: {$ref: '#/components/schemas/DirectiveType'}
        from_status:
          oneOf:
          - {$ref: '#/components/schemas/DirectiveStatus'}
          - {type: 'null'}
        to_status: {$ref: '#/components/schemas/DirectiveStatus'}
        reason: {type: string, maxLength: 1000}
        recipients:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            properties:
              role: {$ref: '#/components/schemas/AgentRole'}
              ack_status:
                type: string
                enum: [PENDING, DELIVERED, ACKNOWLEDGED, REJECTED, EXPIRED, COMPLETED, FAILED]
              execution_id:
                type: [string, 'null']
                format: uuid
              at:
                type: [string, 'null']
                format: date-time
            required: [role, ack_status]
        acknowledgement:
          description: устарело (не выдаётся сервером); используйте `recipients`
          oneOf:
          - {$ref: '#/components/schemas/DirectiveAck'}
          - {type: 'null'}
      required: [directive_id, directive_type, from_status, to_status]
    ApprovalRequestedPayload:
      type: object
      properties:
        approval_id: {type: string, format: uuid}
        action_type: {$ref: '#/components/schemas/ApprovalActionType'}
        task_id:
          type: [string, 'null']
          format: uuid
        risk_level: {$ref: '#/components/schemas/RiskLevel'}
        summary: {type: string}
        expires_at:
          type: [string, 'null']
          format: date-time
      required: [approval_id, action_type, risk_level, summary]
    ApprovalDecidedPayload:
      type: object
      properties:
        approval_id: {type: string, format: uuid}
        action_type: {$ref: '#/components/schemas/ApprovalActionType'}
        status:
          type: string
          enum: [APPROVED, REJECTED, EXPIRED, CANCELLED]
        decided_by:
          type: [string, 'null']
          format: uuid
          description: id пользователя, принявшего решение (null — истечение/отмена системой); имя — GET /approvals/{approval_id}
        decision_reason:
          type: [string, 'null']
          maxLength: 2000
      required: [approval_id, action_type, status]
      description: Компактный payload SSE (sse-event.schema.json#/$defs/approval_decided); полное представление — Approval.
    GateCompletedPayload:
      type: object
      properties:
        gate_execution_id: {type: string, format: uuid}
        gate_type: {type: string}
        task_id:
          type: [string, 'null']
          format: uuid
        required: {type: boolean}
        status: {$ref: '#/components/schemas/GateExecutionStatus'}
        evidence_id:
          type: [string, 'null']
          format: uuid
        findings_count: {type: integer}
      required: [gate_execution_id, gate_type, required, status, findings_count]
    RunCompletedPayload:
      type: object
      properties:
        final_status:
          type: string
          enum: [COMPLETED, FAILED, CANCELLED]
        verdict:
          type: string
          enum: [PENDING, RUNNING, PASS, FAIL, ERROR]
        report_url: {type: string}
      required: [final_status, verdict, report_url]
      description: Терминальное событие run (COMPLETED/FAILED/CANCELLED); после него сервер закрывает поток.
    ChatMessagePayload:
      type: object
      properties:
        chat_message_id: {type: string, format: uuid, description: '= ChatItem.id'}
        thread_id: {type: string, format: uuid}
        scope:
          type: string
          enum: [RUN, ROLE, TASK]
        message_kind:
          type: string
          enum: [USER_TEXT, DIRECTIVE, AGENT_MESSAGE, CLI_HIGHLIGHT, STATUS, APPROVAL, DIRECTIVE_STATUS, SYSTEM_NOTICE]
          description: 'Вид события; соответствие ChatItem.item_type: USER_TEXT→chat_message, DIRECTIVE→directive, AGENT_MESSAGE→agent_message,
            CLI_HIGHLIGHT→cli_excerpt, APPROVAL→approval, прочие→system_event'
        sender_type: {$ref: '#/components/schemas/ChatSenderType'}
        sender_id:
          type: [string, 'null']
        sender_role:
          type: [string, 'null']
          description: Роль агента или ACP-участник (orchestrator)
        provider:
          oneOf:
          - {$ref: '#/components/schemas/CliProvider'}
          - {type: 'null'}
        task_id:
          type: [string, 'null']
          format: uuid
        target_role:
          oneOf:
          - {$ref: '#/components/schemas/AgentRole'}
          - {type: 'null'}
        mentions:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/AgentRole'}
        body: {type: string, maxLength: 8000}
        acp_type:
          oneOf:
          - {$ref: '#/components/schemas/AcpMessageType'}
          - {type: 'null'}
          description: '= ChatItem.acp_type (для AGENT_MESSAGE)'
        source_event_id:
          type: [string, 'null']
          format: uuid
        directive_id:
          type: [string, 'null']
          format: uuid
        approval_id:
          type: [string, 'null']
          format: uuid
        links:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [diff, test_report, evidence, finding, artifact, task, approval, gate_execution]
                description: '= ChatItem.refs[].type'
              id: {type: string, format: uuid}
            required: [kind, id]
        created_at: {type: string, format: date-time}
      required: [chat_message_id, thread_id, scope, message_kind, sender_type, body, created_at]
      description: 'Плоский payload SSE (sse-event.schema.json#/$defs/chat_message). Клиент сопоставляет его с ChatItem по id =
        chat_message_id; полное представление (UserRef, статусы поручения/approval) — GET /runs/{run_id}/chat.'
    SseRunStateChanged:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: run.state_changed}
          payload: {$ref: '#/components/schemas/RunStateChangedPayload'}
    SseTaskStateChanged:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: task.state_changed}
          payload: {$ref: '#/components/schemas/TaskStateChangedPayload'}
    SseAgentMessage:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: agent.message}
          payload: {$ref: '#/components/schemas/AgentMessagePayload'}
    SseCliOutput:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: cli.output}
          payload: {$ref: '#/components/schemas/CliOutputPayload'}
    SseDirectiveImpactReady:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: directive.impact_ready}
          payload: {$ref: '#/components/schemas/DirectiveImpactReadyPayload'}
    SseDirectiveStateChanged:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: directive.state_changed}
          payload: {$ref: '#/components/schemas/DirectiveStateChangedPayload'}
    SseApprovalRequested:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: approval.requested}
          payload: {$ref: '#/components/schemas/ApprovalRequestedPayload'}
    SseApprovalDecided:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: approval.decided}
          payload: {$ref: '#/components/schemas/ApprovalDecidedPayload'}
    SseGateCompleted:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: gate.completed}
          payload: {$ref: '#/components/schemas/GateCompletedPayload'}
    SseRunCompleted:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: run.completed}
          payload: {$ref: '#/components/schemas/RunCompletedPayload'}
    SseChatMessage:
      allOf:
      - {$ref: '#/components/schemas/SseEnvelope'}
      - type: object
        properties:
          type: {const: chat.message}
          payload: {$ref: '#/components/schemas/ChatMessagePayload'}
    SseHeartbeat:
      type: object
      properties:
        type: {const: heartbeat}
        timestamp: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        last_seq: {type: integer, format: int64}
      required: [type, timestamp, last_seq]
      description: 'Каждые 15 с; без id: (не сдвигает Last-Event-ID).'
    SseEvent:
      oneOf:
      - {$ref: '#/components/schemas/SseRunStateChanged'}
      - {$ref: '#/components/schemas/SseTaskStateChanged'}
      - {$ref: '#/components/schemas/SseAgentMessage'}
      - {$ref: '#/components/schemas/SseCliOutput'}
      - {$ref: '#/components/schemas/SseDirectiveImpactReady'}
      - {$ref: '#/components/schemas/SseDirectiveStateChanged'}
      - {$ref: '#/components/schemas/SseApprovalRequested'}
      - {$ref: '#/components/schemas/SseApprovalDecided'}
      - {$ref: '#/components/schemas/SseGateCompleted'}
      - {$ref: '#/components/schemas/SseRunCompleted'}
      - {$ref: '#/components/schemas/SseChatMessage'}
      - {$ref: '#/components/schemas/SseHeartbeat'}
      description: 'Значение поля data: SSE-кадра. event: = type.'
    WorkspaceSseEventType:
      type: string
      enum: [run.state_changed, approval.requested, approval.decided, run.completed]
      description: Подмножество SseEventType, доставляемое потоком уведомлений workspace (streamWorkspaceEvents).
    WorkspaceSseHeartbeat:
      type: object
      properties:
        type: {const: heartbeat}
        workspace_id: {type: string, format: uuid}
        timestamp: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
      required: [type, workspace_id, timestamp]
      description: 'Каждые 15 с простоя; без id: (не сдвигает Last-Event-ID).'
    WorkspaceSseEvent:
      oneOf:
      - {$ref: '#/components/schemas/SseRunStateChanged'}
      - {$ref: '#/components/schemas/SseApprovalRequested'}
      - {$ref: '#/components/schemas/SseApprovalDecided'}
      - {$ref: '#/components/schemas/SseRunCompleted'}
      - {$ref: '#/components/schemas/WorkspaceSseHeartbeat'}
      description: 'Значение поля data: кадра потока workspace (streamWorkspaceEvents). event: = type; id: = курсор потока.'
