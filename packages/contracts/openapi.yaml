        delivered_at:
          type: [string, 'null']
          format: date-time
        acknowledged_at:
          type: [string, 'null']
          format: date-time
      required: [recipient_role, status]
    Directive:
      type: object
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        chat_message_id: {type: string, format: uuid}
        target:
          type: object
          properties:
            type: {$ref: '#/components/schemas/DirectiveTargetType'}
            role: {$ref: '#/components/schemas/AgentRole'}
            task_id: {type: string, format: uuid}
            approval_id: {type: string, format: uuid}
          required: [type]
        directive_type: {$ref: '#/components/schemas/DirectiveType'}
        message: {type: string}
        status: {$ref: '#/components/schemas/DirectiveStatus'}
        impact_status: {$ref: '#/components/schemas/DirectiveImpactStatus'}
        impacts:
          type: array
          items: {$ref: '#/components/schemas/DirectiveImpact'}
        impact_summary:
          type: [string, 'null']
          maxLength: 2000
          description: Сводка анализа влияния (та же, что `summary` события directive.impact_ready); null до завершения анализа
        requires_confirmation: {type: boolean}
        approval_id:
          type: [string, 'null']
          format: uuid
        delivery:
          type: object
          properties:
            state:
              type: string
              enum: [NOT_DISPATCHED, DISPATCHED, PARTIALLY_ACKNOWLEDGED, ACKNOWLEDGED]
            acknowledgements:
              type: array
              items: {$ref: '#/components/schemas/DirectiveAck'}
          required: [state, acknowledgements]
          description: 'Доставка (delivered): агенты получили и подтвердили поручение.'
        completion:
          type: object
          properties:
            state:
              type: string
              enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, FAILED, CANCELLED]
            resulting_task_ids:
              type: array
              items: {type: string, format: uuid}
            completed_at:
              type: [string, 'null']
              format: date-time
          required: [state, resulting_task_ids]
          description: 'Выполнение (completed): связанные задачи завершены и проверены. Отлично от delivery.'
        submitted_by: {$ref: '#/components/schemas/UserRef'}
        created_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        updated_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        version: {type: integer, format: int64, minimum: 0, description: Optimistic locking version; ETag = "v<version>"}
      required: [id, run_id, target, directive_type, message, status, impact_status, impacts, requires_confirmation, delivery, completion, submitted_by,
        created_at, version]
    DirectivePage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Directive'}
        next_cursor:
          type: [string, 'null']
          description: Opaque base64url cursor; null — конец выборки.
      required: [items, next_cursor]
      description: Страница Directive (cursor pagination).
    ProviderInstallation:
      type: object
      properties:
        installation_id: {type: string, format: uuid}
        host: {type: string, description: hostname worker_hosts}
