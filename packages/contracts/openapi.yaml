        edition: {type: string}
        clause_ref: {type: string}
        control_code: {type: string}
        applicability: {$ref: '#/components/schemas/ApplicabilityStatus'}
        agent_role:
          oneOf:
          - {$ref: '#/components/schemas/AgentRole'}
          - {type: 'null'}
        status: {$ref: '#/components/schemas/ComplianceStatus'}
        verification_method:
          type: string
          enum: [automated_gate, agent_review, manual, document_check]
          description: Check контроля (трассировка standard → control → check → evidence → verdict)
        gate_type:
          type: [string, 'null']
        gate_execution_id:
          type: [string, 'null']
          format: uuid
        evidence_id:
          type: [string, 'null']
          format: uuid
        reviewed_by:
          oneOf:
          - {$ref: '#/components/schemas/UserRef'}
          - {type: 'null'}
        checked_at:
          type: [string, 'null']
          format: date-time
        result_id:
          type: [string, 'null']
          format: uuid
          description: Актуальная строка compliance_results
        notes:
          type: [string, 'null']
          description: Пояснение вердикта (обоснование человека или движка; секреты редактируются)
