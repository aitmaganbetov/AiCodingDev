          enum: [none, restricted, unrestricted]
        path_policy:
          type: array
          items: {type: string}
          description: Allowlist glob внутри worktree
        path_deny:
          type: array
          items: {type: string}
        task_paths_allowed: {type: boolean, description: Дополнительно разрешены файлы, явно перечисленные в задаче}
        comments_only_paths:
          type: array
          items: {type: string}
      required: [write_scope, network, path_policy, path_deny, task_paths_allowed, comments_only_paths]
    AgentProfile:
      type: object
      properties:
        role: {$ref: '#/components/schemas/AgentRole'}
