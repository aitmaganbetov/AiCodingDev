          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
      required: [id, gate_id, gate_type, required, status]
    Finding:
      type: object
      properties:
        id: {type: string, format: uuid}
        task_id:
          type: [string, 'null']
          format: uuid
        gate_execution_id:
          type: [string, 'null']
          format: uuid
        severity: {$ref: '#/components/schemas/FindingSeverity'}
        rule_id: {type: string}
        title: {type: string, description: Краткое описание находки (секреты редактируются)}
        cwe_id:
          type: [string, 'null']
        file_path:
          type: [string, 'null']
        line:
          type: [integer, 'null']
        status: {$ref: '#/components/schemas/FindingStatus'}
        evidence_id:
          type: [string, 'null']
          format: uuid
        run_id: {type: string, format: uuid}
        source:
          type: string
          enum: [gate, agent_review, manual, github]
        fixed_in_commit_sha:
          type: [string, 'null']
        control_refs:
          type: array
          items: {type: string}
          description: Коды контролей (standard_controls.control_code), к которым относится находка
        resolved_by:
          oneOf:
          - {$ref: '#/components/schemas/UserRef'}
          - {type: 'null'}
