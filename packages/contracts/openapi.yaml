      description: 'OQ-47 (2): проверки через GitHub API выполняет воркер (единственный процесс с ключом App). PENDING → SUCCEEDED
        (result_id — github_installations.id или repositories.id) | FAILED (error.code: not_found, foreign_app, permissions, conflict,
        no_installation, not_accessible, invalid_repository, github_unavailable). Чужая или несуществующая проверка ⇒ 404.'
      parameters:
