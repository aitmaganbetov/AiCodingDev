      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Tenant для коллекций без родительского ресурса. Не член workspace ⇒ 404.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 255, pattern: '^[A-Za-z0-9._:-]+$'}
      description: Обязателен для POST-команд. Хранится 24 ч в scope (workspace, user).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, example: '"v12"'}
      description: Сильный ETag текущей версии. Отсутствует ⇒ 428, не совпадает ⇒ 412.
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema: {type: string}
      description: Необязательный ETag run для защиты от устаревшего UI.
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 1024}
      description: Opaque cursor из next_cursor
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RepositoryId:
      name: repository_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RepositoryCommit:
      name: commit
      in: query
      description: 'Commit: hex SHA (7–64 символа, сокращённый допускается) или имя ветки (только refs/heads/). Без параметра —
        HEAD ветки по умолчанию, иначе последний READY-снимок индекса. Неверный формат — 422, отсутствующий commit — 404.'
      schema: {type: string, minLength: 1, maxLength: 255}
    IndexCommit:
      name: commit
      in: query
      description: 'Проиндексированный commit: hex-префикс SHA (7–64 символа). Без параметра — последний READY-снимок индекса
        репозитория. Нет READY-снимка этого commit — 404, префикс совпадает с несколькими commit — 422.'
      schema: {type: string, minLength: 7, maxLength: 64, pattern: '^[0-9a-f]{7,64}$'}
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DirectiveId:
      name: directive_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SourceId:
      name: source_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    EvidenceId:
      name: evidence_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    FindingId:
      name: finding_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ControlId:
      name: control_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    GitHubInstallationRef:
      name: github_installation_id
      in: path
      required: true
      description: id строки установки в платформе (не числовой installation_id GitHub)
      schema: {type: string, format: uuid}
    PullRequestId:
      name: pull_request_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    ETag:
      description: Сильный ETag "v<version>"
      schema: {type: string}
    Location:
      description: URI созданного ресурса
      schema: {type: string}
    RateLimitLimit:
      description: Квота окна
      schema: {type: integer}
    RateLimitRemaining:
      description: Остаток квоты
      schema: {type: integer}
    RateLimitReset:
      description: Секунд до сброса окна
      schema: {type: integer}
    RetryAfter:
      description: Секунд до повтора
      schema: {type: integer}
    IdempotencyReplayed:
      description: true — ответ воспроизведён из idempotency-хранилища
      schema: {type: boolean}
    SetCookie:
      description: aicd_session (HttpOnly; Secure; SameSite=Strict; Path=/api) и aicd_csrf (Secure; SameSite=Strict; не HttpOnly)
      schema: {type: string}
  responses:
    BadRequest:
      description: 400 malformed_request | idempotency_key_missing
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: 401 unauthenticated | session_expired
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: 403 forbidden | csrf_failed | four_eyes_violation | policy_denied
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: 404 not_found (включая чужой workspace — защита от перечисления)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: 409 conflict | version_mismatch | invalid_state_transition | idempotency_key_in_flight | last_owner
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: 412 precondition_failed (If-Match не совпал)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
    PreconditionRequired:
      description: 428 precondition_required (нет If-Match)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: 422 validation_error | idempotency_key_reuse | invalid_cursor
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: 429 rate_limited
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
        RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
    InternalError:
      description: 500 internal_error (непредвиденная ошибка; в теле только общий текст и request_id)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: 503 provider_unavailable | service_unavailable
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
  schemas:
    GitHubInstallation:
      type: object
      properties:
        id: {type: string, format: uuid}
        installation_id: {type: integer, minimum: 1}
        account_login: {type: string}
        account_type: {type: string, enum: [user, organization]}
        repository_selection: {type: string, enum: [all, selected]}
        permissions:
          type: object
          additionalProperties: {type: string}
          description: Права установки (подмножество минимального набора App, SC-GH-04)
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED, REVOKED]
          description: PENDING — установка зарегистрирована, проверка через GitHub API на воркере ещё не завершена (account_login, account_type, permissions — заглушки)
        verification_id:
          type: [string, 'null']
          format: uuid
          description: Только в ответе connectGitHubInstallation — проверка установки воркером (getGitHubVerification)
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      required: [id, installation_id, account_login, account_type, repository_selection, permissions, status, created_at, updated_at]
    GitHubVerification:
      type: object
      description: Проверка GitHub App на воркере (OQ-47 (2)) — подключение установки или доступ установки к репозиторию.
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [installation, repository]}
        status: {type: string, enum: [PENDING, SUCCEEDED, FAILED]}
        project_id:
          type: [string, 'null']
          format: uuid
        result_id:
          type: [string, 'null']
          format: uuid
          description: SUCCEEDED — id установки (kind=installation) или репозитория (kind=repository)
        error:
          oneOf:
          - type: 'null'
          - type: object
            properties:
              code: {type: string}
              detail: {type: [string, 'null']}
            required: [code, detail]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at:
          type: [string, 'null']
          format: date-time
      required: [id, kind, status, project_id, result_id, error, created_at, updated_at, completed_at]
    GitHubInstallationList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GitHubInstallation'}
      required: [items]
    GitHubInstallationSetup:
      type: object
      properties:
        install_url: {type: string, description: URL установки App на GitHub со state}
        state: {type: string}
        expires_at: {type: string, format: date-time}
      required: [install_url, state, expires_at]
    GitHubInstallationConnectRequest:
      type: object
      properties:
        installation_id: {type: integer, minimum: 1, maximum: 9007199254740992}
        state: {type: string, minLength: 1, maxLength: 1024}
        setup_action: {type: string, enum: [install, update]}
      required: [installation_id, state]
      additionalProperties: false
    GitHubWebhookAck:
      type: object
      properties:
        status: {type: string, enum: [accepted, ignored, duplicate]}
      required: [status]
    PullRequestState:
      type: string
      enum: [OPEN, CLOSED, MERGED]
    PullRequest:
      type: object
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        repository_id: {type: string, format: uuid}
        repository_full_name: {type: string}
        run_id:
          type: [string, 'null']
          format: uuid
        pr_number: {type: integer, minimum: 1}
        url: {type: string}
        state: {$ref: '#/components/schemas/PullRequestState'}
        head_branch: {type: string}
        base_branch: {type: string}
        head_sha: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
        merged_commit_sha:
          type: [string, 'null']
        create_action_id:
          type: [string, 'null']
          format: uuid
        merge_action_id:
          type: [string, 'null']
          format: uuid
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        merged_at:
          type: [string, 'null']
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
      required: [id, project_id, repository_id, repository_full_name, run_id, pr_number, url, state, head_branch, base_branch,
        head_sha, merged_commit_sha, create_action_id, merge_action_id, created_at, updated_at, merged_at, closed_at]
    PullRequestPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PullRequest'}
        next_cursor:
          type: [string, 'null']
      required: [items, next_cursor]
    PullRequestCreateRequest:
      type: object
      properties:
        task_id: {type: string, format: uuid, description: Обязателен, если в run несколько задач с изменениями}
        base_branch: {type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9._/-]+$', description: По умолчанию — ветка по умолчанию
            репозитория}
        title: {type: string, minLength: 1, maxLength: 256, pattern: '^[^\x00-\x1f\x7f]+$', description: 'Без управляющих символов'}
      additionalProperties: false
    PullRequestJob:
      type: object
      properties:
        run_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        repository_id: {type: string, format: uuid}
        repository_full_name: {type: string}
        head_branch: {type: string}
        head_sha: {type: string}
        base_branch: {type: string}
        title: {type: string}
        status: {type: string, enum: [QUEUED]}
      required: [run_id, task_id, repository_id, repository_full_name, head_branch, head_sha, base_branch, title, status]
    PullRequestMergeRequest:
      type: object
      properties:
        merge_method: {type: string, enum: [merge, squash, rebase], default: merge}
      additionalProperties: false
    PullRequestMergeAccepted:
      type: object
      properties:
        pull_request_id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        status: {type: string, enum: [AWAITING_APPROVAL]}
      required: [pull_request_id, approval_id, status]
    AnalyticsRate:
      type: [number, 'null']
      minimum: 0
      maximum: 1
      description: Доля 0..1; null — знаменатель равен нулю (нет данных).
    AnalyticsDurationStats:
      type: object
      properties:
        p50: {type: [number, 'null'], minimum: 0}
        p90: {type: [number, 'null'], minimum: 0}
        avg: {type: [number, 'null'], minimum: 0}
      required: [p50, p90, avg]
      description: Секунды; null — нет завершённых элементов в окне.
    AnalyticsSummary:
      type: object
      properties:
        window:
          type: object
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
          required: [from, to]
        project_id: {type: [string, 'null'], format: uuid}
        runs:
          type: object
          properties:
            total: {type: integer, minimum: 0}
            finished: {type: integer, minimum: 0}
            completed: {type: integer, minimum: 0}
            success_rate: {$ref: '#/components/schemas/AnalyticsRate'}
            by_status:
              type: object
              additionalProperties: {type: integer, minimum: 0}
              description: Ключи — RunStatus.
            duration_seconds: {$ref: '#/components/schemas/AnalyticsDurationStats'}
            by_mode:
              type: array
              description: Время и исход по режиму run (cost/time per mode; стоимость в деньгах CLI не сообщают).
              items:
                type: object
                properties:
                  mode: {$ref: '#/components/schemas/RunMode'}
                  total: {type: integer, minimum: 0}
                  finished: {type: integer, minimum: 0}
                  completed: {type: integer, minimum: 0}
                  success_rate: {$ref: '#/components/schemas/AnalyticsRate'}
                  avg_duration_seconds: {type: [number, 'null'], minimum: 0}
                required: [mode, total, finished, completed, success_rate, avg_duration_seconds]
          required: [total, finished, completed, success_rate, by_status, duration_seconds, by_mode]
        daily:
          type: array
          maxItems: 400
          items:
            type: object
            properties:
              date: {type: string, format: date}
              runs_created: {type: integer, minimum: 0}
              runs_completed: {type: integer, minimum: 0}
              runs_failed: {type: integer, minimum: 0}
              runs_cancelled: {type: integer, minimum: 0}
            required: [date, runs_created, runs_completed, runs_failed, runs_cancelled]
        tasks:
          type: object
          properties:
            attempts: {type: integer, minimum: 0}
            succeeded: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            retries: {type: integer, minimum: 0, description: Попытки с attempt_no > 1 (retry count).}
            verified_completion_rate: {$ref: '#/components/schemas/AnalyticsRate'}
            tasks_finished: {type: integer, minimum: 0}
            latency_seconds: {$ref: '#/components/schemas/AnalyticsDurationStats'}
            by_role:
              type: array
              items:
                type: object
                properties:
                  role: {type: string}
                  attempts: {type: integer, minimum: 0}
                  succeeded: {type: integer, minimum: 0}
                  failed: {type: integer, minimum: 0}
                  retries: {type: integer, minimum: 0}
                  verified_completion_rate: {$ref: '#/components/schemas/AnalyticsRate'}
                required: [role, attempts, succeeded, failed, retries, verified_completion_rate]
          required: [attempts, succeeded, failed, retries, verified_completion_rate, tasks_finished, latency_seconds, by_role]
        gates:
          type: array
          items:
            type: object
            properties:
              gate_type: {type: string}
              total: {type: integer, minimum: 0}
              passed: {type: integer, minimum: 0}
              failed: {type: integer, minimum: 0}
              errored: {type: integer, minimum: 0}
              skipped: {type: integer, minimum: 0, description: SKIPPED/NOT_APPLICABLE — не входят в pass_rate (SKIPPED ≠ PASS).}
              pass_rate: {$ref: '#/components/schemas/AnalyticsRate'}
              avg_duration_seconds: {type: [number, 'null'], minimum: 0}
            required: [gate_type, total, passed, failed, errored, skipped, pass_rate, avg_duration_seconds]
        providers:
          type: array
          items:
            type: object
            properties:
              provider: {type: string}
              executions: {type: integer, minimum: 0}
              collected: {type: integer, minimum: 0}
              errors: {type: integer, minimum: 0, description: TIMED_OUT + CRASHED}
              rate_limited: {type: integer, minimum: 0}
              auth_required: {type: integer, minimum: 0}
              cancelled: {type: integer, minimum: 0}
              in_progress: {type: integer, minimum: 0}
              success_rate: {$ref: '#/components/schemas/AnalyticsRate'}
              avg_duration_seconds: {type: [number, 'null'], minimum: 0}
              failures_by_category:
                type: object
                additionalProperties: {type: integer, minimum: 0}
              tokens:
                type: object
                properties:
                  total: {type: [integer, 'null'], minimum: 0, description: 'Сумма токенов, сообщённых CLI; null — CLI не сообщали.'}
                  source: {type: string, enum: [cli_reported, not_exposed_by_cli, mixed]}
                  executions_reported: {type: integer, minimum: 0}
                required: [total, source, executions_reported]
            required: [provider, executions, collected, errors, rate_limited, auth_required, cancelled, in_progress, success_rate,
              avg_duration_seconds, failures_by_category, tokens]
        review_loops:
          type: object
          properties:
            review_requests: {type: integer, minimum: 0}
            fix_requests: {type: integer, minimum: 0}
            review_chains: {type: integer, minimum: 0, description: Цепочки correlation_id с REVIEW_REQUEST.}
            chains_with_fixes: {type: integer, minimum: 0}
            avg_fix_rounds: {type: [number, 'null'], minimum: 0}
            max_fix_rounds: {type: integer, minimum: 0}
            loops_exhausted: {type: integer, minimum: 0, description: Задачи в BLOCKED(REVIEW_LOOP_EXHAUSTED), обновлённые в окне.}
          required: [review_requests, fix_requests, review_chains, chains_with_fixes, avg_fix_rounds, max_fix_rounds, loops_exhausted]
        agent_messages:
          type: object
          properties:
            total: {type: integer, minimum: 0}
            by_type:
              type: object
              additionalProperties: {type: integer, minimum: 0}
              description: Ключи — тип ACP-сообщения.
          required: [total, by_type]
        approvals:
          type: object
          properties:
            requested: {type: integer, minimum: 0}
            pending: {type: integer, minimum: 0}
            by_status:
              type: object
              additionalProperties: {type: integer, minimum: 0}
            wait_seconds: {$ref: '#/components/schemas/AnalyticsDurationStats'}
          required: [requested, pending, by_status, wait_seconds]
        context:
          type: object
          properties:
            packs: {type: integer, minimum: 0}
            avg_size_bytes: {type: [number, 'null'], minimum: 0}
            max_size_bytes: {type: [integer, 'null'], minimum: 0}
            fragments: {type: integer, minimum: 0}
            stale_fragment_ratio: {$ref: '#/components/schemas/AnalyticsRate'}
            usefulness:
              type: object
              description: 'FR-CI-08: доля уникальных путей фрагментов Context Pack, на которые сослались заявления итога попыток,
                подтверждённых платформой (SUCCEEDED после обязательных gates).'
              properties:
                rate: {$ref: '#/components/schemas/AnalyticsRate'}
                packs_evaluated: {type: integer, minimum: 0}
                fragments_referenced: {type: integer, minimum: 0}
                fragments_total: {type: integer, minimum: 0}
                truncated: {type: boolean, description: Оценено не больше 2000 последних пакетов окна.}
              required: [rate, packs_evaluated, fragments_referenced, fragments_total, truncated]
          required: [packs, avg_size_bytes, max_size_bytes, fragments, stale_fragment_ratio, usefulness]
      required: [window, project_id, runs, daily, tasks, gates, providers, review_loops, agent_messages, approvals, context]
    RunMode:
      type: string
      enum: [CREATE, DEVELOP, DEBUG, AUDIT, MODERNIZE, SECURITY, OPTIMIZE, TEST, MAINTAIN, DOCUMENT, REVIEW]
      description: Каноническое перечисление (docs/README.md §3).
    RunStatus:
      type: string
      enum: [CREATED, DISCOVERY, PLANNED, AWAITING_APPROVAL, RUNNING, VERIFYING, COMPLETED, PAUSED, BLOCKED, FAILED, CANCELLED]
      description: Каноническое перечисление (docs/README.md §3).
    TaskStatus:
      type: string
      enum: [PENDING, READY, LEASED, RUNNING, VERIFYING, SUCCEEDED, BLOCKED, RETRY_WAIT, FAILED, CANCELLED]
      description: Каноническое перечисление (docs/README.md §3).
    TaskBlockedReason:
      type: string
      enum: [APPROVAL_REQUIRED, PROVIDER_UNAVAILABLE, AUTH_REQUIRED, DIRECTIVE_REPLAN, RUN_PAUSED, DOCS_REQUIRED, MANUAL_REVIEW, REVIEW_LOOP_EXHAUSTED,
        DEPENDENCY_FAILED]
      description: Каноническое перечисление (docs/README.md §3).
    ExecutionStatus:
      type: string
      enum: [QUEUED, STARTING, RUNNING, EXITED, COLLECTED, TIMED_OUT, CANCELLED, CRASHED, AUTH_REQUIRED, RATE_LIMITED]
      description: Каноническое перечисление (docs/README.md §3).
    CliErrorCode:
      type: string
      enum: [CLI_NOT_INSTALLED, AUTH_REQUIRED, RATE_LIMITED, TIMEOUT, SANDBOX_DENIED, PROCESS_FAILED, OUTPUT_PARSE_ERROR, UNSUPPORTED_VERSION,
        CANCELLED]
      description: Каноническое перечисление (docs/README.md §3).
    FailureCategory:
      type: string
      enum: [CLI_NOT_INSTALLED, AUTH_REQUIRED, RATE_LIMITED, TIMEOUT, SANDBOX_DENIED, PROCESS_FAILED, OUTPUT_PARSE_ERROR, UNSUPPORTED_VERSION,
        CANCELLED, GATE_FAILED, REVIEW_REJECTED, LEASE_LOST, WORKER_CRASH, POLICY_DENIED, INTERNAL_ERROR]
      description: Каноническое перечисление (docs/README.md §3).
    CliProvider:
      type: string
      enum: [codex, claude]
      description: Каноническое перечисление (docs/README.md §3).
    AgentRole:
      type: string
      enum: [requirements, architect, planner, developer, reviewer, security, qa, database, performance, devops, maintenance, documentation]
      description: Каноническое перечисление (docs/README.md §3).
