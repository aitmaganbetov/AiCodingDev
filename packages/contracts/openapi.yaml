# AiCodingDev REST API v1 — Phase 0 contract. Источник правил: docs/api/API_DESIGN.md.
openapi: 3.1.0
info:
  title: AiCodingDev Internal REST API
  version: 1.0.0-phase0
  description: 'Phase 0 контракт (ТЗ §8). Правила — docs/api/API_DESIGN.md. Операции с x-tz-addition: true — дополнения к таблице ТЗ §8. Ничего
    не реализовано; спецификация переносится в packages/contracts/ в Phase 1 (ADR-0013).'
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
- {url: /api/v1}
security:
- cookieAuth: []
  csrfHeader: []
tags:
- {name: auth}
- {name: health}
- {name: workspaces}
- {name: projects}
- {name: runs}
- {name: chat}
- {name: tasks}
- {name: evidence}
- {name: quality}
- {name: providers}
- {name: approvals}
- {name: documentation}
- {name: audit}
- {name: analytics}
- {name: github}
paths:
  /auth/login:
    post:
      operationId: login
      summary: Вход локальной учётной записью [дополнение к ТЗ]
      tags: [auth]
      description: 'Без X-CSRF-Token: защита login-CSRF через проверку Origin/Sec-Fetch-Site. Ротация session id. Неверные данные ⇒ 401 без указания,
        что именно неверно. Лимит 10/мин на IP и блокировка аккаунта после 5 неудач (locked_until).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security: []
      x-required-permission: public
      x-audit-action: auth.login
      x-tz-addition: true
  /auth/logout:
    post:
      operationId: logout
      summary: Выход (отзыв сессии) [дополнение к ТЗ]
      tags: [auth]
      responses:
        '204':
          description: Сессия отозвана; cookies очищены
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: authenticated
      x-audit-action: auth.logout
      x-tz-addition: true
  /auth/reauthenticate:
    post:
      operationId: reauthenticate
      summary: Step-up — повторный ввод пароля в текущей сессии [дополнение к ТЗ]
      tags: [auth]
      description: 'SC-IAM-08, SECURITY_ARCHITECTURE §3.2. Операции критического набора (политики workspace и провайдеров, управление
        участниками, утверждение approvals из набора four-eyes) требуют ввода пароля не старше 10 минут, иначе 403 step_up_required.
        Успех ⇒ ротация сессии (новые cookies и csrf_token, старая сессия отозвана, абсолютный срок не продлевается). Неверный пароль ⇒
        403 reauthentication_failed (сессия остаётся действительной; неудача учитывается счётчиком блокировки входа). Лимит — как у входа
        на IP и 5/мин на пользователя.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReauthenticateRequest'}
      responses:
        '200':
          description: Пароль подтверждён, сессия ротирована
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: authenticated
      x-audit-action: auth.reauthenticated
      x-tz-addition: true
  /auth/session:
    get:
      operationId: getSession
      summary: Текущая сессия, CSRF-токен и членства [дополнение к ТЗ]
      tags: [auth]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: authenticated
      x-audit-action: none
      x-tz-addition: true
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness [дополнение к ТЗ]
      tags: [health]
      security: []
      servers:
      - {url: /, description: Health-эндпоинты вне /api/v1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: public
      x-audit-action: none
      x-tz-addition: true
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness [дополнение к ТЗ]
      tags: [health]
      security: []
      servers:
      - {url: /, description: Health-эндпоинты вне /api/v1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: Не готов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
      x-required-permission: public
      x-audit-action: none
      x-tz-addition: true
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: Workspaces текущего пользователя
      tags: [workspaces]
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspacePage'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: authenticated
      x-audit-action: none
    post:
      operationId: createWorkspace
      summary: Создать workspace (создатель становится owner)
      tags: [workspaces]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: workspace:create
      x-audit-action: workspace.create
  /workspaces/{workspace_id}:
    get:
      operationId: getWorkspace
      summary: Workspace с настройками и версией [дополнение к ТЗ]
      tags: [workspaces]
      description: 'Название, slug, роль текущего пользователя, настройки (`WorkspaceSettings`) и `version` (ETag `"v<version>"`).
        Не член workspace ⇒ 404 (OQ-45 (f)).'
      parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: member:read
      x-audit-action: none
      x-tz-addition: true
    patch:
      operationId: updateWorkspace
      summary: Изменить название и политики workspace [дополнение к ТЗ]
      tags: [workspaces]
      description: 'Merge-patch: отсутствующее поле не меняется. `name` — owner/admin (`workspace:update`); `settings.allow_single_member_self_approval`
        — только owner (SECURITY_ARCHITECTURE §11, иначе 403 и `authz.denied`). `If-Match` обязателен (428/412). Аудит `workspace.update`
        (metadata `changed` — имена полей, `from`/`to` для политик) и `policy.changed` при изменении политики.'
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/WorkspaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceUpdateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: workspace:update
      x-permission-depends-on: settings
      x-audit-action: workspace.update
      x-tz-addition: true
  /workspaces/{workspace_id}/events:
    get:
      operationId: streamWorkspaceEvents
      summary: SSE-поток уведомлений workspace (approvals, статусы run) [дополнение к ТЗ]
      tags: [workspaces]
      description: 'Уведомления workspace (API_DESIGN §13.1, EVENT_SCHEMAS §5.1): события `approval.requested`, `approval.decided`,
        `run.state_changed`, `run.completed` всех run workspace из `run_event_log`. Кадр: `id: <cursor>` (UTC-время записи события в
        журнал, микросекунды epoch), `event: <type>`, `data: SseEnvelope` (поле `seq` — номер события в его run). Возобновление —
        `Last-Event-ID`: сервер повторяет события с перекрытием 60 с, клиент обязан дедуплицировать по `event_id`. Без `Last-Event-ID`
        — с текущего момента (минус перекрытие); состояние экрана клиент берёт из REST. Курсор старше 24 ч ⇒ 410 (перечитать REST и
        подключиться без Last-Event-ID). Heartbeat каждые 15 с без `id:`. Доступ проверяется при подключении, каждые 60 с и по сигналу
        отзыва; лимиты — общие с потоками run (5 на пользователя, 30 мин). Approvals вне run (`DOCS_DOWNLOAD` без run) в поток не попадают.'
      parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - name: Last-Event-ID
        in: header
        schema: {type: string, pattern: '^[0-9]{1,19}$'}
        description: '`id:` последнего полученного кадра (курсор потока workspace)'
      - name: types
        in: query
        schema:
          type: array
          items: {$ref: '#/components/schemas/WorkspaceSseEventType'}
        description: Фильтр типов (heartbeat всегда)
      responses:
        '200':
          description: 'text/event-stream. Кадры: `id: <cursor>`, `event: <type>`, `data: <SseEnvelope JSON>`; heartbeat каждые 15 с; `retry: 3000`.'
          content:
            text/event-stream:
              schema: {type: string}
              x-sse-event-schema: {$ref: '#/components/schemas/WorkspaceSseEvent'}
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            X-Accel-Buffering:
              schema: {type: string, const: 'no'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410':
          description: 410 replay_window_exceeded — курсор старше окна повтора; перечитать состояние REST и подключиться без Last-Event-ID
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: run:read
      x-audit-action: sse.connect
      x-tz-addition: true
  /workspaces/{workspace_id}/members:
    get:
      operationId: listMembers
      summary: Участники workspace [дополнение к ТЗ]
      tags: [workspaces]
      parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberPage'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: member:read
      x-audit-action: none
      x-tz-addition: true
    post:
      operationId: addMember
      summary: Добавить участника [дополнение к ТЗ]
      tags: [workspaces]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/WorkspaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: member:manage
      x-audit-action: member.add
      x-tz-addition: true
  /workspaces/{workspace_id}/members/{user_id}:
    patch:
      operationId: updateMember
      summary: Изменить роль участника [дополнение к ТЗ]
      tags: [workspaces]
      description: Понижение последнего owner ⇒ 409 last_owner.
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/UserId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberUpdateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: member:manage
      x-audit-action: member.role_change
      x-tz-addition: true
    delete:
      operationId: removeMember
      summary: Удалить участника [дополнение к ТЗ]
      tags: [workspaces]
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/UserId'}
      responses:
        '204': {description: 'Удалён; его сессии теряют доступ к workspace, SSE закрываются'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: member:manage
      x-audit-action: member.remove
      x-tz-addition: true
  /projects:
    get:
      operationId: listProjects
      summary: Проекты workspace
      tags: [projects]
      parameters:
      - {$ref: '#/components/parameters/WorkspaceHeader'}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/ProjectStatus'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      security:
      - cookieAuth: []
      x-required-permission: project:read
      x-audit-action: none
    post:
      operationId: createProject
      summary: Создать проект
      tags: [projects]
      parameters:
      - {$ref: '#/components/parameters/WorkspaceHeader'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
