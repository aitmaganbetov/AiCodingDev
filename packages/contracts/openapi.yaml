      description: Страница ActivityEvent workspace (cursor pagination), новые сверху (created_at desc).
    SystemHealthStatus:
      type: string
      enum: [ok, degraded, down, unknown]
      description: unknown — не измерено (причина — detail); не трактуется как ok.
    SystemHealthComponent:
      type: object
      properties:
        name:
          type: string
          enum: [api, database, redis, object_storage, outbox, workers, queues, backup]
        status: {$ref: '#/components/schemas/SystemHealthStatus'}
        checked_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        latency_ms:
          type: [number, 'null']
          minimum: 0
        measurements:
          type: object
          additionalProperties:
            type: [number, string, boolean, 'null']
          description: Измеренные значения компонента (имена — snake_case); только фактически измеренное
        detail:
          type: [string, 'null']
          maxLength: 1000
          description: Причина статуса без технических деталей зависимостей (хостов, учётных данных, текста ошибок)
      required: [name, status, checked_at, latency_ms, measurements, detail]
    WorkerHostHealth:
      type: object
      properties:
        id: {type: string, format: uuid}
        hostname: {type: string}
        kind:
          type: string
          enum: [api, orchestrator, outbox, exec, verify, index]
        status:
          type: string
          enum: [ONLINE, DRAINING, OFFLINE]
        last_heartbeat_at: {type: string, format: date-time, description: Последний heartbeat процесса (каждые heartbeat_interval_seconds)}
        heartbeat_age_seconds: {type: number, minimum: 0, description: По часам БД}
        heartbeat_interval_seconds:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: Интервал heartbeat процесса (worker_hosts.labels); null — процесс не пишет heartbeat
        liveness:
          allOf:
          - {$ref: '#/components/schemas/SystemHealthStatus'}
          description: ok — возраст ≤ 3 интервалов, degraded — ≤ 10, иначе down; unknown — интервал неизвестен или процесс
            остановлен штатно (OFFLINE)
        version:
          type: [string, 'null']
          maxLength: 64
      required: [id, hostname, kind, status, last_heartbeat_at, heartbeat_age_seconds, heartbeat_interval_seconds, liveness,
        version]
    WorkerKindHealth:
      type: object
      properties:
        kind:
          type: string
          enum: [api, orchestrator, outbox, exec, verify, index]
        status:
          allOf:
          - {$ref: '#/components/schemas/SystemHealthStatus'}
          description: Живость по самому свежему heartbeat неостановленных процессов вида; нет таких процессов — down,
            если вид ожидается (expected), иначе unknown
        expected: {type: boolean, description: Вид перечислен в настройке установки AICD_EXPECTED_WORKER_KINDS}
        hosts: {type: integer, minimum: 0}
        active_hosts: {type: integer, minimum: 0, description: Процессы не в статусе OFFLINE}
        freshest_heartbeat_age_seconds:
          type: [number, 'null']
          minimum: 0
        heartbeat_interval_seconds:
          type: [number, 'null']
          exclusiveMinimum: 0
      required: [kind, status, expected, hosts, active_hosts, freshest_heartbeat_age_seconds, heartbeat_interval_seconds]
    QueueHealth:
      type: object
      properties:
        queue: {type: string}
        ready: {type: integer, minimum: 0}
        delayed: {type: integer, minimum: 0}
        dead_letters: {type: integer, minimum: 0}
      required: [queue, ready, delayed, dead_letters]
    BackupComponentHealth:
      type: object
      properties:
        component:
          type: string
          enum: [postgres_base, postgres_wal, postgres_dump, artifacts, secrets]
        last_status:
          type: string
          enum: [success, failure, unknown]
        last_success_at:
          type: [string, 'null']
          format: date-time
        stale: {type: boolean, description: Нет успешного бэкапа дольше порога (как алерты AicdBackup*)}
      required: [component, last_status, last_success_at, stale]
    SystemHealth:
      type: object
      properties:
        status:
          allOf:
          - {$ref: '#/components/schemas/SystemHealthStatus'}
          description: down — отказ database или object_storage; degraded — любая деградация/отказ прочих; unknown компонентов
            итог не меняет
        checked_at: {type: string, format: date-time, description: Время фактической проверки (ответ может быть из кэша)}
        cache_ttl_seconds: {type: integer, minimum: 0}
        components:
          type: array
          items: {$ref: '#/components/schemas/SystemHealthComponent'}
        worker_hosts:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/WorkerHostHealth'}
          description: null — не прочитано
        worker_kinds:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/WorkerKindHealth'}
          description: Живость по видам воркеров; null — не прочитано
        queues:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/QueueHealth'}
          description: null — не измерено (Redis недоступен)
        backups:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/BackupComponentHealth'}
          description: null — файл статуса бэкапа не смонтирован в api или не прочитан
      required: [status, checked_at, cache_ttl_seconds, components, worker_hosts, worker_kinds, queues, backups]
    AgentPermissions:
      type: object
      properties:
        write_scope:
          type: string
