  /integrations/github/webhook:
    post:
      operationId: receiveGitHubWebhook
      summary: Приём вебхуков GitHub (FR-GH-02, SC-GH-01…03) [дополнение к ТЗ]
      tags: [github]
      security: []
      description: 'Без сессии и CSRF. X-Hub-Signature-256 = HMAC-SHA256(webhook secret, сырое тело) проверяется до разбора JSON
        (constant-time, два секрета на время ротации); неверная/отсутствующая подпись ⇒ 401 и запись REJECTED без payload. Дедупликация
        по X-GitHub-Delivery ⇒ повтор 200 duplicate без обработки. Событие вне allowlist ⇒ 202 ignored. Тело ≤ 25 MiB (413).
        Payload — подсказка: обработчик перечитывает состояние через GitHub API. Обработка асинхронна (outbox).'
      parameters:
      - {name: X-GitHub-Event, in: header, required: true, schema: {type: string, maxLength: 64}}
      - {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string, maxLength: 64}}
      - {name: X-Hub-Signature-256, in: header, required: false, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Повторная доставка (дедупликация, без обработки)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitHubWebhookAck'}
        '202':
          description: Принято к обработке или проигнорировано (событие вне allowlist)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitHubWebhookAck'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413':
          description: 413 payload_too_large
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '415':
          description: 415 unsupported_media_type (вебхук должен быть настроен с content type application/json)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-required-permission: public
      x-audit-action: github.webhook.received
      x-tz-addition: true
  /runs/{run_id}/pull-requests:
    post:
      operationId: requestPullRequest
      summary: Открыть PR в GitHub из проверенного результата run (FR-GH-03, P8-04) [дополнение к ТЗ]
      tags: [github]
      description: 'Только COMPLETED run, репозиторий которого привязан к активной установке GitHub App; источник — последний worktree
        задачи SUCCEEDED с коммитом, на котором есть PASS gate (несколько задач с изменениями ⇒ task_id обязателен, 422). Изменения
        CI-конфигурации (.github/workflows/** и аналоги) без APPROVED MANUAL_REVIEW ⇒ 403 policy_denied + approval_id (approval создаётся).
        Внешние действия (push ветки aicd/*, создание PR, ревью-комментарий с итогами gates, commit status aicd/verification)
        исполняет воркер через ledger external_actions; повтор/сбой не создаёт второй PR.'
      parameters:
