        allowed_tools:
          type: array
          items: {type: string}
        required_capabilities:
          type: array
          items: {type: string}
        acp_send:
          type: array
          items: {$ref: '#/components/schemas/AcpMessageType'}
          description: Типы ACP, которые роль вправе отправлять (окончательная проверка — брокер)
        complexity_band:
          type: object
          properties:
            min: {$ref: '#/components/schemas/ComplexityLevel'}
            max: {$ref: '#/components/schemas/ComplexityLevel'}
