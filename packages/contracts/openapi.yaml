        requested_at: {type: string, format: date-time, description: 'UTC, ISO 8601 с Z'}
        completed_at:
          type: [string, 'null']
          format: date-time
        installation:
          oneOf:
          - {$ref: '#/components/schemas/ProviderInstallation'}
