[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
path_separator = os
file_template = %%(rev)s_%%(slug)s
# URL задаётся переменной окружения AICD_MIGRATOR_DATABASE_URL (роль aicd_migrator).

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
