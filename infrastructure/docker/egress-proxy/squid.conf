# AiCodingDev egress-proxy (P2-08, ADR-0010 п.4, SC-NET-01, SC-NET-05).
# Allowlist forward proxy для runner-контейнеров в сети `sandbox` (internal: true).
# Политика: ТОЛЬКО CONNECT на порт 443 к хостам из allowlist; plain HTTP, прочие порты,
# IP-литералы и private/link-local адреса назначения — запрещены. Кэш выключен.
# DNS резолвит только proxy (у runner нет внешнего резолвера).
#
# Файлы allowlist (точные имена хостов, по одному на строку, `#` — комментарий):
#   /etc/squid/aicd/allowlist.d/*.txt  — монтируется read-only (см. compose.sandbox.yaml)
# Пустой allowlist = запрещено всё (secure by default).

http_port 3128

# --- ACL ---------------------------------------------------------------------------------
acl SSL_ports port 443
acl CONNECT method CONNECT

# Источники: только сеть sandbox (подсеть задаётся в compose.sandbox.yaml).
acl sandbox_src src 172.30.0.0/24
# Для интеграционных тестов/нестандартной подсети можно расширить через include ниже.
include /etc/squid/aicd/conf.d/*.conf

# Разрешённые хосты: точное совпадение имени (без ведущей точки — поддомены НЕ разрешаются).
acl allowed_hosts dstdomain "/etc/squid/aicd/allowlist.d/allowed-hosts.txt"

# IP-литералы в запросе (IPv4 и [IPv6]) — запрещены, только имена.
acl ip_literal dstdom_regex -n ^[0-9.]+$ ^\[.*\]$ ^[0-9a-fA-F:]+:[0-9a-fA-F:]*$

# Private / loopback / link-local / CGNAT / multicast назначения (после резолвинга, второй слой).
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl private_dst dst 192.168.0.0/16 192.0.0.0/24 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl private_dst dst ::1 fc00::/7 fe80::/10 ff00::/8

# --- Правила (порядок важен; первое совпадение выигрывает) ----------------------------------
http_access deny !sandbox_src
http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access deny ip_literal
http_access deny !allowed_hosts
http_access deny private_dst
http_access allow CONNECT allowed_hosts
http_access deny all

# ICP/HTCP/SNMP выключены.
icp_access deny all
htcp_access deny all
snmp_access deny all

# --- Без кэша, без утечек заголовков ------------------------------------------------------------
cache deny all
cache_mem 0 MB
forwarded_for delete
httpd_suppress_version_string on

# --- Тайм-ауты / DNS ---------------------------------------------------------------------------
dns_timeout 10 seconds
connect_timeout 15 seconds
negative_dns_ttl 30 seconds

# --- Логи в stdout/stderr (отказы → метрика egress_denied_total по access log) --------------------
logformat aicd %ts.%03tu src=%>a method=%rm dst=%ru status=%>Hs action=%Ss bytes=%<st
access_log stdio:/dev/stdout aicd
cache_log stdio:/dev/stderr
cache_store_log none
logfile_rotate 0
pid_filename none
coredump_dir /tmp
shutdown_lifetime 3 seconds
pinger_enable off
