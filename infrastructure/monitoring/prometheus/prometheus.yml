# Prometheus профиля observability (P8-06/P8-08, SC-OBS-03):
#   docker compose -f infrastructure/docker/compose.yaml --profile observability up -d
# Prometheus и Alertmanager не публикуют порты: доступ — через Grafana (вход по паролю) или `docker compose exec`.
# /metrics api/воркеров защищён bearer-токеном (secret metrics_token) и доступен только в сети backend.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: aicodingdev-local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: aicd-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

  # Воркеры (`aicd-worker <kind>`, AICD_METRICS_PORT=9464): DNS-обнаружение сервисов compose — отсутствующий
  # сервис не даёт цели (и ложного AicdTargetDown), появившийся подхватывается без правки конфигурации.
  - job_name: aicd-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    dns_sd_configs:
      - names: [worker-outbox, worker-orchestrator, worker-exec, worker-index]
        type: A
        port: 9464
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
