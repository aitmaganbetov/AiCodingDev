# Источник данных Grafana (P8-08): Prometheus во внутренней сети monitoring, только чтение.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: aicd-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
