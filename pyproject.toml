[project]
name = "aicodingdev"
version = "0.1.0.dev0"
description = "AiCodingDev — self-hosted AI Coding Development & Multi-Agent Orchestration platform"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2.7",
  "pydantic-settings",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic",
  "argon2-cffi",
  "redis>=5",
  "boto3",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "pyyaml",
  "jsonschema",
  "httpx>=0.28.1",
  "dramatiq[redis]>=2.2.1",
  "tree-sitter>=0.25",
  "tree-sitter-python>=0.25",
  "tree-sitter-javascript>=0.25",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-php>=0.25",
  "cryptography>=44",
  "prometheus-client==0.26.0",
]

[project.scripts]
aicd = "aicd_cli.main:main"
aicd-worker = "aicd_worker.main:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "hypothesis",
  "mypy",
  "ruff",
  "import-linter",
  "openapi-spec-validator",
  "schemathesis",
  "types-PyYAML",
  "types-jsonschema",
  "boto3-stubs[s3]",
  "pip-audit",
  "pytest-cov",
  "datamodel-code-generator>=0.91.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/platform/aicd_platform",
  "packages/contracts/aicd_contracts",
  "packages/identity/aicd_identity",
  "packages/projects/aicd_projects",
  "packages/security/aicd_security",
  "packages/cli_adapters/aicd_cli_adapters",
  "packages/orchestration/aicd_orchestration",
  "packages/verification/aicd_verification",
  "packages/standards/aicd_standards",
  "packages/collaboration/aicd_collaboration",
  "packages/code_intelligence/aicd_code_intelligence",
  "packages/analytics/aicd_analytics",
  "packages/integrations_github/aicd_integrations_github",
  "apps/api/aicd_api",
  "apps/cli/aicd_cli",
  "apps/worker/aicd_worker",
]

[tool.hatch.build.targets.wheel.force-include]
# Нормативные JSON Schema нужны во время исполнения (разбор AgentResult/ACP, P4-03).
"packages/contracts/schemas" = "aicd_contracts/schemas"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages/*", "apps/*", "tests"]
extend-exclude = ["tests/fixtures/code"]  # исходники-фикстуры индексатора (P5-03), не код проекта

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "TID"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # кириллица допустима; длину строк кода контролирует ruff format

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S607", "S608", "PT012", "PT018", "E501", "E741", "SIM117"]
"scripts/perf/**" = ["S105", "S603", "S607"]  # стенд замеров: процессы приложения/git/redis, пароль тестового пользователя
"infrastructure/migrations/**" = ["E501"]
"packages/contracts/aicd_contracts/generated/**" = ["E501", "A001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/platform:packages/contracts:packages/identity:packages/projects:packages/security:packages/cli_adapters:packages/orchestration:packages/verification:packages/standards:packages/collaboration:packages/code_intelligence:packages/analytics:packages/integrations_github:apps/api:apps/cli:apps/worker"
explicit_package_bases = true
files = ["packages", "apps/api", "apps/cli", "apps/worker", "tests", "scripts"]
exclude = ["^infrastructure/migrations/", "^apps/web/", "^tests/fixtures/code/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "db: requires PostgreSQL (AICD_TEST_DATABASE_ADMIN_URL)",
  "redis: requires Redis",
  "s3: requires S3-compatible storage (AICD_TEST_S3_ENDPOINT)",
  "docker: requires a local Docker daemon (skipped when unavailable)",
  "acceptance: P9-01 acceptance suite AC-01…AC-16 (assigned from tests/acceptance/matrix.yaml)",
  "security: security suite (ТЗ §20; SECURITY_CONTROLS ST-*), `pytest -m security`; report — scripts/security_report.py",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["*/aicd_cli_adapters/fake/fake_cli.py"]  # исполняется в дочернем процессе (сценарии проверяются тестами адаптера)
source = ["aicd_platform", "aicd_identity", "aicd_projects", "aicd_security", "aicd_api", "aicd_contracts", "aicd_cli",
          "aicd_cli_adapters", "aicd_orchestration", "aicd_verification", "aicd_standards", "aicd_collaboration",
          "aicd_code_intelligence", "aicd_analytics", "aicd_integrations_github", "aicd_worker"]

[tool.importlinter]
root_packages = ["aicd_platform", "aicd_contracts", "aicd_security", "aicd_identity", "aicd_projects", "aicd_cli_adapters",
                 "aicd_orchestration", "aicd_verification", "aicd_standards", "aicd_collaboration", "aicd_code_intelligence",
                 "aicd_integrations_github", "aicd_analytics", "aicd_api", "aicd_cli", "aicd_worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Слои: приложения → домены → security → platform/contracts"
type = "layers"
layers = [
  "aicd_api | aicd_cli | aicd_worker",
  "aicd_orchestration",
  "aicd_projects | aicd_cli_adapters | aicd_verification | aicd_standards | aicd_collaboration | aicd_code_intelligence | aicd_integrations_github | aicd_analytics",
  "aicd_identity",
  "aicd_security",
  "aicd_platform",
  "aicd_contracts",
]

[[tool.importlinter.contracts]]
name = "Приватные модули домена (repository) недоступны другим модулям — только через api"
type = "forbidden"
source_modules = ["aicd_api", "aicd_cli", "aicd_worker", "aicd_projects", "aicd_platform", "aicd_security"]
forbidden_modules = ["aicd_identity.repository"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Платформенный слой и security не зависят от доменов и приложений"
type = "forbidden"
source_modules = ["aicd_platform", "aicd_security", "aicd_contracts"]
forbidden_modules = ["aicd_identity", "aicd_projects", "aicd_cli_adapters", "aicd_orchestration", "aicd_verification",
                     "aicd_standards", "aicd_collaboration", "aicd_code_intelligence", "aicd_integrations_github",
                     "aicd_analytics", "aicd_api", "aicd_cli", "aicd_worker"]

[[tool.importlinter.contracts]]
name = "Запрет SDK AI-провайдеров (ТЗ §1, ADR-0003)"
type = "forbidden"
source_modules = ["aicd_platform", "aicd_contracts", "aicd_security", "aicd_identity", "aicd_projects",
                  "aicd_cli_adapters", "aicd_orchestration", "aicd_verification", "aicd_standards", "aicd_collaboration",
                  "aicd_code_intelligence", "aicd_integrations_github", "aicd_analytics", "aicd_api", "aicd_cli",
                  "aicd_worker"]
forbidden_modules = ["openai", "anthropic", "mistralai", "cohere", "ollama", "langchain", "litellm"]
ignore_imports = []
