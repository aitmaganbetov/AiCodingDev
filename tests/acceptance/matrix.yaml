        tests:
          - py: tests/e2e/test_phase5_acceptance.py::test_ac02_attach_index_stack_and_context_pack
      - text: project_technologies заполнены (стек определён)
        tests:
          - py: tests/e2e/test_phase5_acceptance.py::test_ac02_attach_index_stack_and_context_pack
      - text: План проходит валидацию ацикличности
        tests:
          - py: tests/e2e/test_phase5_acceptance.py::test_ac02_attach_index_stack_and_context_pack
          - py: tests/unit/test_orchestration_core.py::test_acyclic_plans_validate_and_respect_edges
      - text: План с циклом отклоняется PLAN_CYCLE_DETECTED
        tests:
