# P9-01: матрица приёмки AC-01…AC-16 (docs/planning/ACCEPTANCE_CRITERIA.md, ТЗ §19).
#
# Каждый AC разложен на пункты (clauses) — утверждения текста критерия; у пункта — доказывающие его тесты:
#   py:  node id pytest (точное совпадение или все параметризации `id[...]`);
#   web: "<suite>:<файл относительно testDir>::<начало заголовка теста>", suite ∈ {live, mocked}.
# Пункт без тестов недопустим (кроме kind: real_cli). Результаты берутся ТОЛЬКО из junit-отчётов прогона
# (scripts/run_acceptance.py); тест, не найденный в отчёте, = MISSING (≠ PASS); SKIPPED ≠ PASS.
# kind: real_cli — часть критерия, проверяемая только opt-in прогоном с настоящими Codex/Claude CLI (**RC** в
# ACCEPTANCE_CRITERIA.md); пока P2-01/P2-13 BLOCKED, такие пункты отчитываются как BLOCKED с причиной.
# Каталог тестов pytest с этими node id получает маркер `acceptance` (tests/conftest.py) — `pytest -m acceptance`.

real_cli_blocked_reason: >-
  Opt-in прогон с реальными CLI невозможен: P2-01 (spike probe Codex/Claude CLI), P2-05/P2-06 (адаптеры реальных CLI)
  и P2-13 (opt-in набор) — BLOCKED: нет машины с установленными и авторизованными официальными Codex CLI и Claude Code
  CLI (решение владельца, IMPLEMENTATION_BACKLOG §Phase 2; OQ-01, OQ-03). Тестов real-CLI в репозитории нет.

criteria:
  - id: AC-01
    title: Подключение локального репозитория, создание проекта, запуск DEVELOP
    clauses:
      - text: Локальный Git-репозиторий из allowlist привязывается к проекту (201); путь вне allowlist отклоняется
        tests:
          - py: tests/acceptance/test_ac01_develop_run.py::test_ac01_attach_local_repo_create_project_start_develop_run
          - py: tests/integration/test_api_projects.py::test_attach_local_repository
          - py: tests/integration/test_api_projects.py::test_attach_rejects_unsafe_paths
          - web: "live:smoke.spec.ts::live smoke"
      - text: POST /runs mode=DEVELOP → 201, status=CREATED
        tests:
          - py: tests/acceptance/test_ac01_develop_run.py::test_ac01_attach_local_repo_create_project_start_develop_run
          - py: tests/integration/test_runs_api.py::test_create_run_is_idempotent_and_key_reuse_with_other_body_is_rejected
      - text: run переходит в DISCOVERY, событие run.state_changed получено по SSE
        tests:
          - py: tests/acceptance/test_ac01_develop_run.py::test_ac01_attach_local_repo_create_project_start_develop_run
          - py: tests/e2e/test_phase3_slice.py::test_develop_run_completes_with_verified_evidence
          - web: "live:mission-control.spec.ts::AC-05"
      - kind: real_cli
        text: То же с реальными CLI (RC)

